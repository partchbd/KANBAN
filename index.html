<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANARCHY RECORDS ❤</title>
    <style>
        :root {
            --bg-default: #0a0a0c;
            --card-bg: rgba(14, 14, 18, 0.85);
            --border-punk: #3a3a4a;
            --text-main: #f3f4f6;
            --text-muted: #6b7280;
            
            /* Paleta Punk de Neones */
            --punk-pink: #ff0055;
            --punk-cyan: #00ffcc;
            --punk-yellow: #ffea00;
            --punk-purple: #9d4edd;
        }

        body {
            font-family: 'Courier New', Courier, monospace, system-ui;
            background: var(--bg-default);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            position: relative;
            background-image: radial-gradient(rgba(255, 0, 85, 0.08) 1px, transparent 0), radial-gradient(rgba(0, 255, 204, 0.08) 1px, transparent 0);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        #body-bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: grayscale(80%) contrast(140%) blur(8px);
            opacity: 0.25;
            z-index: -1;
            display: none;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 0px; /* Estilo crudo/angular */
            border: 3px solid var(--text-main);
            box-shadow: 8px 8px 0px var(--punk-pink);
            box-sizing: border-box;
            z-index: 1;
        }

        h1 {
            text-align: center;
            margin-top: 0;
            font-weight: 900;
            font-size: 3rem;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: -2px;
            border-bottom: 4px dashed var(--punk-cyan);
            padding-bottom: 10px;
            text-shadow: 3px 3px 0px var(--punk-pink);
        }

        /* Tabs Sistema Punk */
        .tabs-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: #000;
            border: 2px solid var(--border-punk);
            color: #fff;
            padding: 12px 20px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.15s ease;
        }

        .tab-btn:hover {
            border-color: var(--punk-yellow);
            color: var(--punk-yellow);
            transform: translate(-2px, -2px);
            box-shadow: 2px 2px 0px var(--punk-yellow);
        }

        /* Estados Activos Personalizados por Pestaña */
        .tab-btn.active[data-tab="Gustos"] {
            background: var(--punk-cyan);
            color: #000;
            border-color: #000;
            box-shadow: 4px 4px 0px #fff;
        }
        .tab-btn.active[data-tab="Por Descubrir"] {
            background: var(--punk-purple);
            color: #fff;
            border-color: #000;
            box-shadow: 4px 4px 0px var(--punk-cyan);
        }
        .tab-btn.active[data-tab="Alertas"] {
            background: var(--punk-pink);
            color: #fff;
            border-color: #000;
            box-shadow: 4px 4px 0px var(--punk-yellow);
        }

        /* Layout Formulario */
        .grid-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            background: #000;
            padding: 24px;
            border: 2px solid var(--border-punk);
            margin-bottom: 20px;
        }

        @media (max-width: 600px) { .grid-form { grid-template-columns: 1fr; } }

        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: span 2; }
        @media (max-width: 600px) { .form-group.full-width { grid-column: span 1; } }

        label {
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: bold;
            color: var(--punk-cyan);
            text-transform: uppercase;
        }

        input, select, textarea {
            padding: 12px;
            border: 2px solid var(--border-punk);
            background-color: #121216;
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
            border-radius: 0;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--punk-yellow);
        }

        .select-with-btn { display: flex; gap: 8px; }
        .select-with-btn select { flex: 1; }
        
        .btn-gear {
            background: #222;
            border: 2px solid var(--border-punk);
            color: white;
            padding: 0 15px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-gear:hover { background: var(--punk-pink); }

        button.btn-guardar {
            grid-column: span 2;
            padding: 16px;
            background-color: var(--text-main);
            color: #000;
            border: 2px solid #000;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--punk-cyan);
        }
        @media (max-width: 600px) { button.btn-guardar { grid-column: span 1; } }
        button.btn-guardar:hover {
            background-color: var(--punk-yellow);
            box-shadow: 4px 4px 0px var(--punk-pink);
        }

        /* Panel de Opciones Modificado */
        .manager-panel {
            display: none;
            grid-column: span 2;
            background: #16161e;
            border: 2px dashed var(--punk-pink);
            padding: 20px;
            margin-bottom: 10px;
        }
        @media (max-width: 600px) { .manager-panel { grid-column: span 1; } }

        .manager-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .manager-item {
            background: #000;
            border: 1px solid var(--border-punk);
            padding: 6px 12px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .manager-item span.delete-opt { color: var(--punk-pink); cursor: pointer; font-weight: bold; }

        /* --- SISTEMA DE COLOR DINÁMICO POR SECCIÓN --- */
        .notas-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        @media (max-width: 768px) { .notas-grid { grid-template-columns: 1fr; } }

        .nota-card {
            background: #000;
            padding: 22px;
            border: 2px solid var(--border-punk);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Colores específicos inyectados dinámicamente según la pestaña */
        .nota-card.card-gustos {
            border-left: 6px solid var(--punk-cyan);
            box-shadow: 4px 4px 0px rgba(0, 255, 204, 0.15);
        }
        .nota-card.card-descubrir {
            border-left: 6px solid var(--punk-purple);
            box-shadow: 4px 4px 0px rgba(157, 78, 221, 0.15);
        }
        .nota-card.card-alertas {
            border-left: 6px solid var(--punk-pink);
            box-shadow: 4px 4px 0px rgba(255, 0, 85, 0.2);
            background: linear-gradient(to right, rgba(255, 0, 85, 0.04), transparent);
        }

        .nota-card img {
            width: 100%;
            max-height: 240px;
            object-fit: cover;
            border: 2px solid var(--border-punk);
            margin-top: 15px;
        }

        .btn-borrar {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 22px;
        }
        .btn-borrar:hover { color: var(--punk-pink); }

        .sub-info {
            font-size: 11px;
            margin-top: 15px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .sub-info span {
            background: #121216;
            padding: 4px 8px;
            border: 1px solid var(--border-punk);
        }

        /* Config superior barra */
        .settings-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #000;
            padding: 12px 20px;
            margin-bottom: 25px;
            border: 2px solid var(--border-punk);
            width: 100%;
            box-sizing: border-box;
            gap: 10px;
            flex-wrap: wrap;
        }
        .backup-btns button {
            background: #121216;
            color: #fff;
            border: 1px solid var(--border-punk);
            padding: 6px 12px;
            cursor: pointer;
            font-family: inherit;
        }
        .backup-btns button:hover { background: var(--text-main); color: #000; }
    </style>
</head>
<body>

    <div id="body-bg-layer"></div>

<div class="container">
    <h1>CRIMINAL RECORDS ❤</h1>

    <!-- Config Punk -->
    <div class="settings-section">
        <div style="display:flex; align-items:center; gap:10px;">
            <label style="margin:0; color:var(--punk-yellow);">⚡ FONDO:</label>
            <input type="file" id="bgInput" accept="image/*" style="display:none;">
            <button onclick="document.getElementById('bgInput').click()">CARGAR WALLPAPER</button>
            <input type="checkbox" id="toggleBg" onchange="toggleCustomBg()" style="cursor:pointer; width:16px; height:16px;">
        </div>
        <div class="backup-btns">
            <button onclick="exportarDatos()">📥 BACKUP JSON</button>
            <button onclick="document.getElementById('importInput').click()">📤 INYECTAR</button>
            <input type="file" id="importInput" accept=".json" style="display:none;" onchange="importarDatos(this)">
        </div>
    </div>

    <!-- Pestañas Con Atributos para Estilos -->
    <div class="tabs-container">
        <button class="tab-btn active" data-tab="Gustos" onclick="cambiarPestaña('Gustos')">⚡ FAVORITOS [CYAN]</button>
        <button class="tab-btn" data-tab="Por Descubrir" onclick="cambiarPestaña('Por Descubrir')">🎬 PLANES [PURPLE]</button>
        <button class="tab-btn" data-tab="Alertas" onclick="cambiarPestaña('Alertas')">⚠️ DISGUSTOS / NO [PINK]</button>
    </div>
    
    <!-- Formulario Extensible -->
    <div class="grid-form">
        
        <div class="form-group">
            <label id="label-dinamico">DATO ACTUAL:</label>
            <div class="select-with-btn">
                <select id="subCategoria">
                    <!-- JS -->
                </select>
                <button class="btn-gear" onclick="toggleManagerPanel()" title="Modificar Opciones">⚙ MODO EDIT</button>
            </div>
        </div>

        <!-- Panel de control de Opciones Custom -->
        <div class="manager-panel" id="managerPanel">
            <label style="color:var(--punk-yellow);">🔧 INSERTAR NUEVA OPCIÓN:</label>
            <div style="display:flex; gap:8px; margin-top:5px;">
                <input type="text" id="nuevaOptInput" placeholder="Ej: Ropa, Fobias, Marcas...">
                <button onclick="agregarNuevaOpcion()" style="background:var(--punk-cyan); color:#000; border:none; padding:0 15px; font-weight:bold; cursor:pointer;">+</button>
            </div>
            <div class="manager-list" id="managerList">
                <!-- JS -->
            </div>
        </div>

        <div class="form-group">
            <label for="obsesion">NIVEL DE OBSESIÓN / INTERÉS:</label>
            <select id="obsesion">
                <option value="⚡ Dato casual / X">⚡ Dato casual / X</option>
                <option value="⚡⚡ Le gusta bastante">⚡⚡ Le gusta bastante</option>
                <option value="⚡⚡⚡ OBSESIÓN SEVERA" selected>⚡⚡⚡ OBSESIÓN SEVERA</option>
                <option value="💀 ADICCIÓN TOTAL / CRÍTICO">💀 ADICCIÓN TOTAL / CRÍTICO</option>
            </select>
        </div>

        <div class="form-group">
            <label for="mood">ESTADO MENTAL EN EL MOMENTO:</label>
            <select id="mood">
                <option value="⚡ Chill / Feliz">⚡ Chill / Feliz</option>
                <option value="🍕 Con Hambre / Antojo">🍕 Con Hambre / Antojo</option>
                <option value="⚡ Casual / Hablando de la nada">⚡ Casual / Hablando de la nada</option>
                <option value="🔥 Enojada / Rant">🔥 Enojada / Rant</option>
            </select>
        </div>

        <div class="form-group">
            <label for="imagenInput">📸 DETONANTE VISUAL (EVIDENCIA - OPT):</label>
            <input type="file" id="imagenInput" accept="image/*" style="font-size:11px;">
        </div>

        <div class="form-group full-width">
            <label for="detalle">REGISTRO DE HECHOS (DATO EXACTO):</label>
            <textarea id="detalle" rows="2" placeholder="Pon la data dura aquí..."></textarea>
        </div>

        <button class="btn-guardar" onclick="procesarYGuardar()">INYECTAR EN MEMORIA CORE</button>
    </div>

    <!-- Buscador Integrado -->
    <div style="margin: 25px 0 15px 0;">
        <input type="text" id="buscador" onkeyup="filtrarNotas()" placeholder="🔍 ESCANEAR PALABRAS CLAVE EN ESTA SECCIÓN..." style="width:100%; box-sizing:border-box; border:2px solid var(--border-punk);">
    </div>

    <!-- Feed de Notas Guardadas -->
    <div class="notas-grid" id="listaNotas"></div>
</div>

<script>
    const opcionesPredeterminadas = {
        "Gustos": ["Comida 🍔", "Música 🎵", "Color 🎨", "Ropa 👗", "Dulces 🍫"],
        "Por Descubrir": ["Pelis / Series 🍿", "Libros 📚", "Lugares ✈️", "Planes 🧗"],
        "Alertas": ["Disgustos Mal 🤢", "Alergias 💊", "Fobias 🕷️", "Fechas Peligro 📅"]
    };

    let diccionarioOpciones = {};
    let seccionActual = "Gustos";

    document.addEventListener("DOMContentLoaded", () => {
        const opcionesGuardadas = localStorage.getItem("diccionarioOpcionesPunk");
        if (opcionesGuardadas) {
            diccionarioOpciones = JSON.parse(opcionesGuardadas);
        } else {
            diccionarioOpciones = JSON.parse(JSON.stringify(opcionesPredeterminadas));
            localStorage.setItem("diccionarioOpcionesPunk", JSON.stringify(diccionarioOpciones));
        }

        inicializarSelectores();
        mostrarNotas();
        loadCustomBg();
    });

    function cambiarPestaña(nuevaSeccion) {
        seccionActual = nuevaSeccion;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        
        document.getElementById("managerPanel").style.display = "none";

        inicializarSelectores();
        mostrarNotas();
    }

    function inicializarSelectores() {
        const subCatSelect = document.getElementById("subCategoria");
        subCatSelect.innerHTML = "";
        
        document.getElementById("label-dinamico").textContent = `CATEGORÍAS [${seccionActual}]:`;

        diccionarioOpciones[seccionActual].forEach(opt => {
            let option = document.createElement("option");
            option.value = opt;
            option.textContent = opt;
            subCatSelect.appendChild(option);
        });

        actualizarListaPanelManager();
    }

    function toggleManagerPanel() {
        const panel = document.getElementById("managerPanel");
        panel.style.display = (panel.style.display === "block") ? "none" : "block";
    }

    function actualizarListaPanelManager() {
        const listContainer = document.getElementById("managerList");
        listContainer.innerHTML = "";

        diccionarioOpciones[seccionActual].forEach((opt, index) => {
            listContainer.innerHTML += `
                <div class="manager-item">
                    <span>${opt}</span>
                    <span class="delete-opt" onclick="eliminarOpcion(${index})">×</span>
                </div>
            `;
        });
    }

    function agregarNuevaOpcion() {
        const input = document.getElementById("nuevaOptInput");
        const valor = input.value.trim();
        if (valor === "") return;

        if (diccionarioOpciones[seccionActual].includes(valor)) { return; }

        diccionarioOpciones[seccionActual].push(valor);
        localStorage.setItem("diccionarioOpcionesPunk", JSON.stringify(diccionarioOpciones));
        
        input.value = "";
        inicializarSelectores();
    }

    function eliminarOpcion(index) {
        diccionarioOpciones[seccionActual].splice(index, 1);
        localStorage.setItem("diccionarioOpcionesPunk", JSON.stringify(diccionarioOpciones));
        inicializarSelectores();
    }

    function procesarYGuardar() {
        const subCategoria = document.getElementById("subCategoria").value;
        const obsesion = document.getElementById("obsesion").value;
        const mood = document.getElementById("mood").value;
        const detalle = document.getElementById("detalle").value;
        const archivoImagen = document.getElementById("imagenInput").files[0];

        if (!subCategoria || detalle.trim() === "") { return; }

        if (archivoImagen) {
            const lector = new FileReader();
            lector.onloadend = () => guardarNotaFinal(subCategoria, obsesion, mood, detalle, lector.result);
            lector.readAsDataURL(archivoImagen);
        } else {
            guardarNotaFinal(subCategoria, obsesion, mood, detalle, null);
        }
    }

    function guardarNotaFinal(subCat, obs, md, det, imgBase64) {
        const nuevaNota = {
            id: Date.now(),
            categoria: seccionActual,
            subCategoria: subCat,
            obsesion: obs,
            mood: md,
            detalle: det,
            imagen: imgBase64,
            fecha: new Date().toLocaleDateString('es-MX', { month: 'short', day: 'numeric' })
        };

        let notas = JSON.parse(localStorage.getItem("misNotasPunk")) || [];
        notas.push(nuevaNota);
        localStorage.setItem("misNotasPunk", JSON.stringify(notas));
        
        document.getElementById("detalle").value = "";
        document.getElementById("imagenInput").value = "";
        mostrarNotas();
    }

    function mostrarNotas() {
        const lista = document.getElementById("listaNotas");
        lista.innerHTML = "";
        
        let notas = JSON.parse(localStorage.getItem("misNotasPunk")) || [];
        let notasFiltradas = notas.filter(n => n.categoria === seccionActual);

        if (notasFiltradas.length === 0) {
            lista.innerHTML = `<p style='color:var(--text-muted); text-align:center; grid-column:span 2; padding:30px; border:2px dashed #222;'>SIN REGISTROS EN ESTA ÁREA</p>`;
            return;
        }

        // ASIGNACIÓN DE COLOR SEGÚN LA SECCIÓN EN LA QUE ESTÁ GUARDADA
        let claseColorSeccion = "";
        if (seccionActual === "Gustos") claseColorSeccion = "card-gustos";
        if (seccionActual === "Por Descubrir") claseColorSeccion = "card-descubrir";
        if (seccionActual === "Alertas") claseColorSeccion = "card-alertas";

        notasFiltradas.reverse().forEach(nota => {
            let imgHtml = nota.imagen ? `<img src="${nota.imagen}">` : '';
            
            lista.innerHTML += `
                <div class="nota-card item-nota ${claseColorSeccion}" data-texto="${nota.detalle.toLowerCase()} ${nota.subCategoria.toLowerCase()}">
                    <button class="btn-borrar" onclick="borrarNota(${nota.id})">×</button>
                    <div>
                        <p style="margin:5px 0 15px 0; font-size:15px; line-height:1.5; font-weight:bold; letter-spacing: -0.5px;">${nota.text = nota.detalle}</p>
                        ${imgHtml}
                    </div>
                    <div class="sub-info">
                        <span>TAG: ${nota.subCategoria}</span>
                        <span>LVL: ${nota.obsesion}</span>
                        <span>MOOD: ${nota.mood}</span>
                        <span>DATE: ${nota.fecha}</span>
                    </div>
                </div>
            `;
        });
    }

    function filtrarNotas() {
        const query = document.getElementById("buscador").value.toLowerCase();
        const items = document.querySelectorAll(".item-nota");
        items.forEach(item => {
            item.style.display = item.getAttribute("data-texto").includes(query) ? "flex" : "none";
        });
    }

    function borrarNota(id) {
        if(confirm("¿BORRAR REGISTRO DE LA BASE DE DATOS?")) {
            let notas = JSON.parse(localStorage.getItem("misNotasPunk")) || [];
            notas = notas.filter(nota => nota.id !== id);
            localStorage.setItem("misNotasPunk", JSON.stringify(notas));
            mostrarNotas();
        }
    }

    // --- Controladores de Fondo ---
    const bgInput = document.getElementById('bgInput');
    const bodyBgLayer = document.getElementById('body-bg-layer');
    const toggleBg = document.getElementById('toggleBg');

    bgInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                localStorage.setItem('customBgPunk', e.target.result);
                applyBgImage(e.target.result);
                toggleBg.checked = true;
                localStorage.setItem('useCustomBgPunk', 'true');
            }
            reader.readAsDataURL(file);
        }
    });

    function applyBgImage(imgData) {
        bodyBgLayer.style.backgroundImage = `url(${imgData})`;
        bodyBgLayer.style.display = 'block';
    }

    function toggleCustomBg() {
        if (toggleBg.checked) {
            const storedImg = localStorage.getItem('customBgPunk');
            if (storedImg) { bodyBgLayer.style.display = 'block'; localStorage.setItem('useCustomBgPunk', 'true'); }
            else { toggleBg.checked = false; }
        } else {
            bodyBgLayer.style.display = 'none'; localStorage.setItem('useCustomBgPunk', 'false');
        }
    }

    function loadCustomBg() {
        const storedImg = localStorage.getItem('customBgPunk');
        const useCustom = localStorage.getItem('useCustomBgPunk');
        if (storedImg) applyBgImage(storedImg);
        if (useCustom === 'true') { toggleBg.checked = true; bodyBgLayer.style.display = 'block'; }
        else { toggleBg.checked = false; bodyBgLayer.style.display = 'none'; }
    }

    // --- Backups ---
    function exportarDatos() {
        const notas = localStorage.getItem("misNotasPunk") || "[]";
        const opciones = localStorage.getItem("diccionarioOpcionesPunk") || "{}";
        const empaquetado = { notas: JSON.parse(notas), opciones: JSON.parse(opciones) };
        const blob = new Blob([JSON.stringify(empaquetado)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `PUNK_BACKUP.json`;
        a.click();
    }

    function importarDatos(input) {
        const archivo = input.files[0];
        if (!archivo) return;
        const lector = new FileReader();
        lector.onload = function(e) {
            try {
                const empaquetado = JSON.parse(e.target.result);
                if (empaquetado.notas && empaquetado.opciones) {
                    localStorage.setItem("misNotasPunk", JSON.stringify(empaquetado.notas));
                    localStorage.setItem("diccionarioOpcionesPunk", JSON.stringify(empaquetado.opciones));
                    diccionarioOpciones = empaquetado.opciones;
                    inicializarSelectores();
                    mostrarNotas();
                    alert("DATOS INYECTADOS CORRECTAMENTE OS");
                }
            } catch (err) { alert("ERROR DE LECTURA."); }
        };
        lector.readAsText(archivo);
    }
</script>

</body>
</html>
