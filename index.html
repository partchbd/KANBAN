<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de Datos Personal Especial</title>
    <style>
        :root {
            --bg-default: #05070c;
            --card-bg: rgba(13, 17, 28, 0.75);
            --card-inner: #0d111c;
            --border-color: rgba(255, 255, 255, 0.05);
            --border-glow: rgba(0, 255, 204, 0.15);
            --text-main: #f8fafc;
            --text-muted: #64748b;
            
            /* Neon Highlights */
            --color-sec1: #00ffcc;
            --color-sec2: #a855f7;
            --color-sec3: #ff3b6f;
            --neon-glow-1: 0 0 10px rgba(0, 255, 204, 0.2);
            --neon-glow-2: 0 0 10px rgba(168, 85, 247, 0.2);
            --neon-glow-3: 0 0 10px rgba(255, 59, 111, 0.2);
        }

        body {
            font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-default);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            letter-spacing: 0.3px;
        }

        #body-bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(25px) brightness(0.4);
            opacity: 0.4;
            z-index: -1;
            display: none;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 35px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255,255,255,0.05);
            box-sizing: border-box;
        }

        .header-app {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-app h1 {
            margin: 0 0 5px 0;
            font-weight: 800;
            font-size: 2.5rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #fff 0%, #64748b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Tabs Interfaz */
        .tabs-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.03); }

        .tab-btn.active[data-tab="seccion1"] { border-color: var(--color-sec1); color: var(--color-sec1); box-shadow: var(--neon-glow-1); }
        .tab-btn.active[data-tab="seccion2"] { border-color: var(--color-sec2); color: var(--color-sec2); box-shadow: var(--neon-glow-2); }
        .tab-btn.active[data-tab="seccion3"] { border-color: var(--color-sec3); color: var(--color-sec3); box-shadow: var(--neon-glow-3); }

        /* Formulario Operaciones */
        .grid-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            background: rgba(4, 6, 10, 0.4);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            margin-bottom: 25px;
        }

        @media (max-width: 600px) { .grid-form { grid-template-columns: 1fr; } }

        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: span 2; }
        @media (max-width: 600px) { .form-group.full-width { grid-column: span 1; } }

        label {
            margin-bottom: 8px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, select, textarea {
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background-color: var(--card-inner);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus, textarea:focus { 
            outline: none; 
            border-color: rgba(255, 255, 255, 0.2); 
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.03);
        }

        .select-with-btn { display: flex; gap: 8px; }
        .select-with-btn select { flex: 1; }
        
        .btn-gear {
            background: #151b26;
            border: 1px solid rgba(255,255,255,0.05);
            color: var(--text-muted);
            border-radius: 8px;
            padding: 0 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-gear:hover { color: #fff; background: #1e2636; }

        button.btn-guardar {
            grid-column: span 2;
            padding: 16px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.2s, transform 0.1s;
        }
        @media (max-width: 600px) { button.btn-guardar { grid-column: span 1; } }
        button.btn-guardar:hover { background-color: #e2e8f0; }
        button.btn-guardar:active { transform: scale(0.99); }

        /* MÓDULO EDIT (MASTERS) */
        .master-panel {
            display: none;
            grid-column: span 2;
            background: #090d14;
            border: 1px dashed rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        @media (max-width: 600px) { .master-panel { grid-column: span 1; } }

        .panel-section {
            background: rgba(0,0,0,0.3);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 14px;
            border: 1px solid rgba(255,255,255,0.02);
        }
        .panel-section h4 { margin: 0 0 10px 0; font-size: 12px; color: #fff; text-transform: uppercase; letter-spacing: 0.5px; }

        .inputs-row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        @media (max-width: 600px) { .inputs-row-grid { grid-template-columns: 1fr; } }

        .manager-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .manager-item {
            background: #111622;
            border: 1px solid rgba(255,255,255,0.05);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .manager-item span.delete-opt { color: var(--color-sec3); cursor: pointer; font-weight: bold; }

        /* BARRA CONTROL ORDENAMIENTO (NUEVO) */
        .sorting-bar {
            display: flex;
            gap: 12px;
            margin: 25px 0 15px 0;
            background: rgba(4, 6, 10, 0.3);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.02);
            align-items: center;
            flex-wrap: wrap;
        }
        .sorting-bar .search-input { flex: 1; min-width: 200px; padding: 10px 14px; font-size: 13px; }
        .sorting-bar select { padding: 10px; font-size: 13px; background-color: var(--card-inner); cursor: pointer; }

        /* Tarjetas Estilo Cyber/Clean */
        .notas-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 10px;
        }
        @media (max-width: 768px) { .notas-grid { grid-template-columns: 1fr; } }

        .nota-card {
            background: var(--card-inner);
            padding: 22px;
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 12px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }
        .nota-card:hover { 
            transform: translateY(-2px);
            border-color: rgba(255,255,255,0.08);
        }

        .nota-card.card-seccion1 { box-shadow: inset 4px 0 0 var(--color-sec1); }
        .nota-card.card-seccion2 { box-shadow: inset 4px 0 0 var(--color-sec2); }
        .nota-card.card-seccion3 { box-shadow: inset 4px 0 0 var(--color-sec3); }

        .nota-card img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 6px;
            margin-top: 14px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .btn-borrar {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 20px;
            transition: color 0.2s;
            line-height: 1;
        }
        .btn-borrar:hover { color: var(--color-sec3); }

        .sub-info {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 18px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .sub-info span {
            background: rgba(255,255,255,0.02);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.04);
            font-weight: 500;
        }

        /* Config superior */
        .settings-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.15);
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
            width: 100%;
            box-sizing: border-box;
            gap: 12px;
            flex-wrap: wrap;
        }
        .backup-btns button {
            background: #111622;
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .backup-btns button:hover { background: #1a2234; }
    </style>
</head>
<body>

    <div id="body-bg-layer"></div>

<div class="container">
    <div class="header-app">
        <h1 id="app-title">REGISTROS CORE</h1>
    </div>

    <div class="settings-section">
        <div style="display:flex; align-items:center; gap:8px;">
            <label style="margin:0;">🖼 Wallpaper:</label>
            <input type="file" id="bgInput" accept="image/*" style="display:none;">
            <button onclick="document.getElementById('bgInput').click()" style="background:#111622; color:white; border:1px solid rgba(255,255,255,0.05); padding:6px 12px; border-radius:6px; font-size:11px; cursor:pointer;">Cargar</button>
            <input type="checkbox" id="toggleBg" onchange="toggleCustomBg()" style="cursor:pointer;">
        </div>
        <div class="backup-btns">
            <button onclick="exportarTodo()">📥 Exportar JSON</button>
            <button onclick="document.getElementById('importInput').click()">📤 Importar JSON</button>
            <input type="file" id="importInput" accept=".json" style="display:none;" onchange="importarTodo(this)">
        </div>
    </div>

    <div class="tabs-container" id="tabsLayout">
        <button class="tab-btn active" data-tab="seccion1" id="btn-seccion1" onclick="cambiarPestaña('seccion1')">Sección 1</button>
        <button class="tab-btn" data-tab="seccion2" id="btn-seccion2" onclick="cambiarPestaña('seccion2')">Sección 2</button>
        <button class="tab-btn" data-tab="seccion3" id="btn-seccion3" onclick="cambiarPestaña('seccion3')">Sección 3</button>
    </div>
    
    <div class="grid-form">
        <div class="form-group">
            <label id="label-dinamico">Clasificación:</label>
            <div class="select-with-btn">
                <select id="subCategoria"></select>
                <button class="btn-gear" onclick="toggleMasterPanel()">⚙ CONFIG</button>
            </div>
        </div>

        <!-- PANEL DE CONTROL MAESTRO -->
        <div class="master-panel" id="masterPanel">
            <div class="panel-section">
                <h4>✏️ Nombres Estructurales</h4>
                <div style="margin-bottom:8px;">
                    <label>Título General:</label>
                    <input type="text" id="editAppTitle" style="width:100%; box-sizing:border-box;" onchange="guardarNombresEstructurales()">
                </div>
                <div class="inputs-row-grid">
                    <div>
                        <label>Pestaña 1:</label>
                        <input type="text" id="editTab1" style="width:100%; box-sizing:border-box;" onchange="guardarNombresEstructurales()">
                    </div>
                    <div>
                        <label>Pestaña 2:</label>
                        <input type="text" id="editTab2" style="width:100%; box-sizing:border-box;" onchange="guardarNombresEstructurales()">
                    </div>
                    <div style="grid-column: span 2;">
                        <label>Pestaña 3:</label>
                        <input type="text" id="editTab3" style="width:100%; box-sizing:border-box;" onchange="guardarNombresEstructurales()">
                    </div>
                </div>
            </div>

            <div class="panel-section">
                <h4>🔧 Modificar Opciones (Pestaña Activa)</h4>
                <div style="display:flex; gap:8px;">
                    <input type="text" id="nuevaOptInput" placeholder="Ej: Nueva opción..." style="flex:1;">
                    <button onclick="agregarNuevaOpcion()" style="background:#fff; color:#000; border:none; padding:0 15px; border-radius:6px; font-weight:bold; cursor:pointer;">+</button>
                </div>
                <div class="manager-list" id="managerList"></div>
            </div>

            <div class="panel-section">
                <h4>🔥 Ajustar Niveles de Importancia</h4>
                <div style="display:flex; gap:8px; margin-bottom:8px;">
                    <input type="text" id="nuevaImportanciaInput" placeholder="Ej: Importancia..." style="flex:1;">
                    <button onclick="agregarItemConfig('nivelesImportancia', 'nuevaImportanciaInput')" style="background:#fff; color:#000; border:none; padding:0 15px; border-radius:6px; font-weight:bold; cursor:pointer;">+</button>
                </div>
                <div class="manager-list" id="importanciaList"></div>
            </div>

            <div class="panel-section">
                <h4>😊 Ajustar Lista de Contextos / Moods</h4>
                <div style="display:flex; gap:8px;">
                    <input type="text" id="nuevoMoodInput" placeholder="Ej: Contexto..." style="flex:1;">
                    <button onclick="agregarItemConfig('moods', 'nuevoMoodInput')" style="background:#fff; color:#000; border:none; padding:0 15px; border-radius:6px; font-weight:bold; cursor:pointer;">+</button>
                </div>
                <div class="manager-list" id="moodsList"></div>
            </div>
        </div>

        <div class="form-group">
            <label for="obsesion">Nivel de Importancia / Interés:</label>
            <select id="obsesion"></select>
        </div>

        <div class="form-group">
            <label for="mood">Humor / Contexto:</label>
            <select id="mood"></select>
        </div>

        <div class="form-group">
            <label for="imagenInput">📸 Foto / Evidencia (Opcional):</label>
            <input type="file" id="imagenInput" accept="image/*" style="font-size:12px; padding:11px;">
        </div>

        <div class="form-group full-width">
            <label for="detalle">Contenido del Registro:</label>
            <textarea id="detalle" rows="2" placeholder="Escribe la información clave aquí..."></textarea>
        </div>

        <button class="btn-guardar" onclick="procesarYGuardar()">Archivar Registro Permanente</button>
    </div>

    <!-- NUEVA BARRA DE CONTROL DE ORDENAMIENTO -->
    <div class="sorting-bar">
        <input type="text" id="buscador" class="search-input" onkeyup="mostrarNotas()" placeholder="🔍 Buscar palabras clave...">
        
        <label style="margin:0 0 0 auto;">Organizar por:</label>
        <select id="selectOrdenamiento" onchange="mostrarNotas()">
            <option value="cronologico_inverso">🕒 Más recientes primero</option>
            <option value="importancia_alta">🔥 Mayor Importancia/Interés</option>
            <option value="categoria_alfa">📁 Categoría (A-Z)</option>
        </select>
    </div>

    <!-- Contenedor Dinámico -->
    <div class="notas-grid" id="listaNotas"></div>
</div>

<script>
    const configPorDefecto = {
        tituloApp: "REGISTROS CORE",
        nombresTabs: { seccion1: "Favoritos", seccion2: "Planes", seccion3: "Alertas / No" },
        opcionesSub: {
            seccion1: ["Comida 🍔", "Música 🎵", "Color 🎨", "Dulces 🍫"],
            seccion2: ["Pelis / Series 🍿", "Lugares por ir ✈️", "Planes juntos 🧗"],
            seccion3: ["Disgustos 🤢", "Alergias 💊", "Fechas Peligro 📅"]
        },
        nivelesImportancia: [
            "⚡ Casual / Detalle Simple",
            "⭐⭐ Le gusta bastante",
            "🔥🔥 Interés Extremo"
        ],
        moods: [ "😊 Feliz / Tranquila", "🍕 Con Antojo", "🥱 Charla Casual", "🔥 Molesta / Queja" ]
    };

    let appConfig = {};
    let seccionActual = "seccion1";

    document.addEventListener("DOMContentLoaded", () => {
        const localConfig = localStorage.getItem("masterAppConfig");
        if (localConfig) {
            appConfig = Object.assign({}, configPorDefecto, JSON.parse(localConfig));
        } else {
            appConfig = JSON.parse(JSON.stringify(configPorDefecto));
            localStorage.setItem("masterAppConfig", JSON.stringify(appConfig));
        }
        aplicarConfiguracionEstructural();
        inicializarSelectoresMecanicos();
        mostrarNotas();
        loadCustomBg();
    });

    function aplicarConfiguracionEstructural() {
        document.getElementById("app-title").textContent = appConfig.tituloApp;
        document.getElementById("btn-seccion1").textContent = appConfig.nombresTabs.seccion1;
        document.getElementById("btn-seccion2").textContent = appConfig.nombresTabs.seccion2;
        document.getElementById("btn-seccion3").textContent = appConfig.nombresTabs.seccion3;
        document.getElementById("editAppTitle").value = appConfig.tituloApp;
        document.getElementById("editTab1").value = appConfig.nombresTabs.seccion1;
        document.getElementById("editTab2").value = appConfig.nombresTabs.seccion2;
        document.getElementById("editTab3").value = appConfig.nombresTabs.seccion3;
    }

    function cambiarPestaña(idSeccion) {
        seccionActual = idSeccion;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`btn-${idSeccion}`).classList.add('active');
        document.getElementById("masterPanel").style.display = "none";
        inicializarSelectoresMecanicos();
        mostrarNotas();
    }

    function inicializarSelectoresMecanicos() {
        const subCatSelect = document.getElementById("subCategoria");
        subCatSelect.innerHTML = "";
        document.getElementById("label-dinamico").textContent = `Categoría [${appConfig.nombresTabs[seccionActual]}]:`;
        appConfig.opcionesSub[seccionActual].forEach(opt => {
            subCatSelect.innerHTML += `<option value="${opt}">${opt}</option>`;
        });

        const obsesionSelect = document.getElementById("obsesion");
        obsesionSelect.innerHTML = "";
        appConfig.nivelesImportancia.forEach(niv => {
            obsesionSelect.innerHTML += `<option value="${niv}">${niv}</option>`;
        });

        const moodSelect = document.getElementById("mood");
        moodSelect.innerHTML = "";
        appConfig.moods.forEach(m => {
            moodSelect.innerHTML += `<option value="${m}">${m}</option>`;
        });

        renderizarListasPanelMaster();
    }

    function toggleMasterPanel() {
        const panel = document.getElementById("masterPanel");
        panel.style.display = (panel.style.display === "block") ? "none" : "block";
    }

    function guardarNombresEstructurales() {
        appConfig.tituloApp = document.getElementById("editAppTitle").value.trim() || "MIS REGISTROS";
        appConfig.nombresTabs.seccion1 = document.getElementById("editTab1").value.trim() || "Sección 1";
        appConfig.nombresTabs.seccion2 = document.getElementById("editTab2").value.trim() || "Sección 2";
        appConfig.nombresTabs.seccion3 = document.getElementById("editTab3").value.trim() || "Sección 3";
        localStorage.setItem("masterAppConfig", JSON.stringify(appConfig));
        aplicarConfiguracionEstructural();
        document.getElementById("label-dinamico").textContent = `Categoría [${appConfig.nombresTabs[seccionActual]}]:`;
    }

    function renderizarListasPanelMaster() {
        const containerSub = document.getElementById("managerList");
        containerSub.innerHTML = "";
        appConfig.opcionesSub[seccionActual].forEach((opt, index) => {
            containerSub.innerHTML += `<div class="manager-item"><span>${opt}</span><span class="delete-opt" onclick="eliminarSubCategoria(${index})">×</span></div>`;
        });

        const containerImp = document.getElementById("importanciaList");
        containerImp.innerHTML = "";
        appConfig.nivelesImportancia.forEach((opt, index) => {
            containerImp.innerHTML += `<div class="manager-item"><span>${opt}</span><span class="delete-opt" onclick="eliminarItemConfig('nivelesImportancia', ${index})">×</span></div>`;
        });

        const containerMoods = document.getElementById("moodsList");
        containerMoods.innerHTML = "";
        appConfig.moods.forEach((opt, index) => {
            containerMoods.innerHTML += `<div class="manager-item"><span>${opt}</span><span class="delete-opt" onclick="eliminarItemConfig('moods', ${index})">×</span></div>`;
        });
    }

    function agregarNuevaOpcion() {
        const input = document.getElementById("nuevaOptInput");
        const valor = input.value.trim();
        if (valor && !appConfig.opcionesSub[seccionActual].includes(valor)) {
            appConfig.opcionesSub[seccionActual].push(valor);
            localStorage.setItem("masterAppConfig", JSON.stringify(appConfig));
            input.value = "";
            inicializarSelectoresMecanicos();
        }
    }

    function eliminarSubCategoria(index) {
        appConfig.opcionesSub[seccionActual].splice(index, 1);
        localStorage.setItem("masterAppConfig", JSON.stringify(appConfig));
        inicializarSelectoresMecanicos();
    }

    function agregarItemConfig(llaveArray, inputId) {
        const input = document.getElementById(inputId);
        const valor = input.value.trim();
        if (valor && !appConfig[llaveArray].includes(valor)) {
            appConfig[llaveArray].push(valor);
            localStorage.setItem("masterAppConfig", JSON.stringify(appConfig));
            input.value = "";
            inicializarSelectoresMecanicos();
        }
    }

    function eliminarItemConfig(llaveArray, index) {
        appConfig[llaveArray].splice(index, 1);
        localStorage.setItem("masterAppConfig", JSON.stringify(appConfig));
        inicializarSelectoresMecanicos();
    }

    function procesarYGuardar() {
        const subCategoria = document.getElementById("subCategoria").value;
        const obsesion = document.getElementById("obsesion").value;
        const mood = document.getElementById("mood").value;
        const detalle = document.getElementById("detalle").value;
        const archivoImagen = document.getElementById("imagenInput").files[0];

        if (!subCategoria || detalle.trim() === "") { alert("Completa los datos del registro."); return; }

        if (archivoImagen) {
            const lector = new FileReader();
            lector.onloadend = () => guardarNotaFinal(subCategoria, obsesion, mood, detalle, lector.result);
            lector.readAsDataURL(archivoImagen);
        } else {
            guardarNotaFinal(subCategoria, obsesion, mood, detalle, null);
        }
    }

    function guardarNotaFinal(subCat, obs, md, det, imgBase64) {
        const nuevaNota = {
            id: Date.now(),
            seccionId: seccionActual,
            subCategoria: subCat,
            obsesion: obs,
            mood: md,
            detalle: det,
            imagen: imgBase64,
            fecha: new Date().toLocaleDateString('es-MX', { month: 'short', day: 'numeric' })
        };

        let notas = JSON.parse(localStorage.getItem("masterAppNotas")) || [];
        notas.push(nuevaNota);
        localStorage.setItem("masterAppNotas", JSON.stringify(notas));
        
        document.getElementById("detalle").value = "";
        document.getElementById("imagenInput").value = "";
        mostrarNotas();
    }

    // NUEVO FORMATO DE PROCESAMIENTO Y ORDENAMIENTO INTEGRADO
    function mostrarNotas() {
        const lista = document.getElementById("listaNotas");
        lista.innerHTML = "";
        
        let notas = JSON.parse(localStorage.getItem("masterAppNotas")) || [];
        const query = document.getElementById("buscador").value.toLowerCase();
        const metodoOrden = document.getElementById("selectOrdenamiento").value;

        // 1. Filtrar primero por Sección Activa y por la query de búsqueda
        let notasFiltradas = notas.filter(n => {
            const cumpleSeccion = n.seccionId === seccionActual;
            const cumpleBuscador = n.detalle.toLowerCase().includes(query) || n.subCategoria.toLowerCase().includes(query);
            return cumpleSeccion && cumpleBuscador;
        });

        if (notasFiltradas.length === 0) {
            lista.innerHTML = `<p style='color:var(--text-muted); text-align:center; grid-column:span 2; padding:40px; font-size:13px;'>Sin registros archivados o que coincidan con la búsqueda.</p>`;
            return;
        }

        // 2. ORDENAR SEGÚN EL MÉTODO SELECCIONADO
        if (metodoOrden === "cronologico_inverso") {
            // El de siempre: de más nuevo a más viejo
            notasFiltradas.sort((a, b) => b.id - a.id);
        } 
        else if (metodoOrden === "importancia_alta") {
            // Evalúa el índice de la opción en appConfig.nivelesImportancia para mandar los altos arriba
            notasFiltradas.sort((a, b) => {
                const indexA = appConfig.nivelesImportancia.indexOf(a.obsesion);
                const indexB = appConfig.nivelesImportancia.indexOf(b.obsesion);
                return indexB - indexA; // El que tenga el índice más alto en el array va arriba
            });
        } 
        else if (metodoOrden === "categoria_alfa") {
            // Orden alfabético basado en la subcategoría
            notasFiltradas.sort((a, b) => a.subCategoria.localeCompare(b.subCategoria));
        }

        // 3. Renderizado final en la cuadrícula
        notasFiltradas.forEach(nota => {
            let imgHtml = nota.imagen ? `<img src="${nota.imagen}">` : '';
            
            lista.innerHTML += `
                <div class="nota-card card-${seccionActual}">
                    <button class="btn-borrar" onclick="borrarNota(${nota.id})">×</button>
                    <div>
                        <p style="margin:5px 0 15px 0; font-size:14.5px; line-height:1.6; font-weight:500;">${nota.detalle}</p>
                        ${imgHtml}
                    </div>
                    <div class="sub-info">
                        <span>📁 ${nota.subCategoria}</span>
                        <span>${nota.obsesion}</span>
                        <span>${nota.mood}</span>
                        <span>📅 ${nota.fecha}</span>
                    </div>
                </div>
            `;
        });
    }

    function borrarNota(id) {
        if(confirm("¿Eliminar este registro permanente?")) {
            let notas = JSON.parse(localStorage.getItem("masterAppNotas")) || [];
            notas = notas.filter(nota => nota.id !== id);
            localStorage.setItem("masterAppNotas", JSON.stringify(notas));
            mostrarNotas();
        }
    }

    // Fondo Dinámico
    const bgInput = document.getElementById('bgInput');
    const bodyBgLayer = document.getElementById('body-bg-layer');
    const toggleBg = document.getElementById('toggleBg');

    bgInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                localStorage.setItem('masterAppBgImg', e.target.result);
                applyBgImage(e.target.result);
                toggleBg.checked = true;
                localStorage.setItem('masterAppUseBg', 'true');
            }
            reader.readAsDataURL(file);
        }
    });

    function applyBgImage(imgData) {
        bodyBgLayer.style.backgroundImage = `url(${imgData})`;
        bodyBgLayer.style.display = 'block';
    }

    function toggleCustomBg() {
        if (toggleBg.checked) {
            const storedImg = localStorage.getItem('masterAppBgImg');
            if (storedImg) { bodyBgLayer.style.display = 'block'; localStorage.setItem('masterAppUseBg', 'true'); }
            else { alert("Carga una imagen primero."); toggleBg.checked = false; }
        } else {
            bodyBgLayer.style.display = 'none'; localStorage.setItem('masterAppUseBg', 'false');
        }
    }

    function loadCustomBg() {
        const storedImg = localStorage.getItem('masterAppBgImg');
        const useCustom = localStorage.getItem('masterAppUseBg');
        if (storedImg) applyBgImage(storedImg);
        if (useCustom === 'true') { toggleBg.checked = true; bodyBgLayer.style.display = 'block'; }
        else { toggleBg.checked = false; bodyBgLayer.style.display = 'none'; }
    }

    function exportarTodo() {
        const notas = localStorage.getItem("masterAppNotas") || "[]";
        const configuracion = localStorage.getItem("masterAppConfig") || "{}";
        const payloadTotal = { notas: JSON.parse(notas), configuracion: JSON.parse(configuracion) };
        const blob = new Blob([JSON.stringify(payloadTotal)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `backup_sistema_maestro.json`;
        a.click();
    }

    function importarTodo(input) {
        const archivo = input.files[0];
        if (!archivo) return;
        const lector = new FileReader();
        lector.onload = function(e) {
            try {
                const payloadTotal = JSON.parse(e.target.result);
                if (payloadTotal.notas && payloadTotal.configuracion) {
                    localStorage.setItem("masterAppNotas", JSON.stringify(payloadTotal.notas));
                    localStorage.setItem("masterAppConfig", JSON.stringify(payloadTotal.configuracion));
                    appConfig = payloadTotal.configuracion;
                    aplicarConfiguracionEstructural();
                    inicializarSelectoresMecanicos();
                    mostrarNotas();
                    alert("¡Estructura y Registros restaurados con éxito!");
                }
            } catch (err) { alert("Error crítico en la lectura del JSON."); }
        };
        lector.readAsText(archivo);
    }
</script>
