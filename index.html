<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de Datos Personal Especial</title>
    <style>
        :root {
            --bg-default: #0a0d14;
            --card-bg: #111622;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            
            /* Colores de acento sutiles para los bordes */
            --color-sec1: #00ffcc;
            --color-sec2: #b55fe6;
            --color-sec3: #ff3b6f;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-default);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        #body-bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(15px);
            opacity: 0.25;
            z-index: -1;
            display: none;
        }

        .container {
            max-width: 850px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        .header-app {
            text-align: center;
            margin-bottom: 25px;
        }

        .header-app h1 {
            margin: 0 0 5px 0;
            font-weight: 700;
            font-size: 2.2rem;
            letter-spacing: -0.5px;
        }

        /* Tabs */
        .tabs-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }

        .tab-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.04); }

        /* Colores dinámicos de pestañas activas */
        .tab-btn.active[data-tab="seccion1"] { background: var(--color-sec1); color: #000; border-color: var(--color-sec1); }
        .tab-btn.active[data-tab="seccion2"] { background: var(--color-sec2); color: #fff; border-color: var(--color-sec2); }
        .tab-btn.active[data-tab="seccion3"] { background: var(--color-sec3); color: #fff; border-color: var(--color-sec3); }

        /* Formulario Limpio */
        .grid-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        @media (max-width: 600px) { .grid-form { grid-template-columns: 1fr; } }

        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: span 2; }
        @media (max-width: 600px) { .form-group.full-width { grid-column: span 1; } }

        label {
            margin-bottom: 6px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            padding: 12px;
            border: 1px solid var(--border-color);
            background-color: #080b11;
            color: var(--text-main);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus { outline: none; border-color: #fff; }

        .select-with-btn { display: flex; gap: 8px; }
        .select-with-btn select { flex: 1; }
        
        .btn-gear {
            background: #1a202c;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            padding: 0 12px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-gear:hover { background: #2d3748; }

        button.btn-guardar {
            grid-column: span 2;
            padding: 14px;
            background-color: #fff;
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }
        @media (max-width: 600px) { button.btn-guardar { grid-column: span 1; } }
        button.btn-guardar:hover { background-color: #e2e8f0; }

        /* --- PANEL CONTROL TOTAL INTERFAZ --- */
        .master-panel {
            display: none;
            grid-column: span 2;
            background: #0f131c;
            border: 1px dashed #334155;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        @media (max-width: 600px) { .master-panel { grid-column: span 1; } }

        .panel-section {
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.03);
        }
        .panel-section h4 { margin: 0 0 8px 0; font-size: 12px; color: #fff; text-transform: uppercase; }

        .inputs-row-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        @media (max-width: 600px) { .inputs-row-grid { grid-template-columns: 1fr; } }

        .manager-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .manager-item {
            background: #1a202c;
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .manager-item span.delete-opt { color: #ff3b6f; cursor: pointer; font-weight: bold; }

        /* Tarjetas */
        .notas-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 20px;
        }
        @media (max-width: 768px) { .notas-grid { grid-template-columns: 1fr; } }

        .nota-card {
            background: #131924;
            padding: 18px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .nota-card.card-seccion1 { border-left: 4px solid var(--color-sec1); }
        .nota-card.card-seccion2 { border-left: 4px solid var(--color-sec2); }
        .nota-card.card-seccion3 { border-left: 4px solid var(--color-sec3); }

        .nota-card img {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 4px;
            margin-top: 12px;
        }

        .btn-borrar {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 18px;
        }
        .btn-borrar:hover { color: #ff3b6f; }

        .sub-info {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 12px;
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .sub-info span {
            background: rgba(255,255,255,0.02);
            padding: 3px 6px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        /* Config de Fondo y Sistema */
        .settings-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            width: 100%;
            box-sizing: border-box;
            gap: 10px;
            flex-wrap: wrap;
        }
        .backup-btns button {
            background: #1a202c;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }
        .backup-btns button:hover { background: #2d3748; }
    </style>
</head>
<body>

    <div id="body-bg-layer"></div>

<div class="container">
    <div class="header-app">
        <h1 id="app-title">REGISTROS CORE</h1>
    </div>

    <!-- Barra de Configuración Superior -->
    <div class="settings-section">
        <div style="display:flex; align-items:center; gap:8px;">
            <label style="margin:0;">🖼 Wallpaper:</label>
            <input type="file" id="bgInput" accept="image/*" style="display:none;">
            <button onclick="document.getElementById('bgInput').click()" style="background:#1a202c; color:white; border:1px solid var(--border-color); padding:5px 10px; border-radius:4px; font-size:11px; cursor:pointer;">Cargar</button>
            <input type="checkbox" id="toggleBg" onchange="toggleCustomBg()" style="cursor:pointer;">
        </div>
        <div class="backup-btns">
            <button onclick="exportarTodo()">📥 Exportar JSON</button>
            <button onclick="document.getElementById('importInput').click()">📤 Importar JSON</button>
            <input type="file" id="importInput" accept=".json" style="display:none;" onchange="importarTodo(this)">
        </div>
    </div>

    <!-- Pestañas Principales Intercambiables -->
    <div class="tabs-container" id="tabsLayout">
        <button class="tab-btn active" data-tab="seccion1" id="btn-seccion1" onclick="cambiarPestaña('seccion1')">Sección 1</button>
        <button class="tab-btn" data-tab="seccion2" id="btn-seccion2" onclick="cambiarPestaña('seccion2')">Sección 2</button>
        <button class="tab-btn" data-tab="seccion3" id="btn-seccion3" onclick="cambiarPestaña('seccion3')">Sección 3</button>
    </div>
    
    <!-- Bloque de Ingreso de Datos -->
    <div class="grid-form">
        
        <div class="form-group">
            <label id="label-dinamico">Clasificación:</label>
            <div class="select-with-btn">
                <select id="subCategoria">
                    <!-- Dinámico -->
                </select>
                <button class="btn-gear" onclick="toggleMasterPanel()">⚙ MODO EDIT</button>
            </div>
        </div>

        <!-- ================= MESA DE CONTROL MAESTRA (EDITA TODO AQUÍ) ================= -->
        <div class="master-panel" id="masterPanel">
            
            <!-- 1. Título y Nombres de Pestañas -->
            <div class="panel-section">
                <h4>✏️ Editar Nombres Principales</h4>
                <div style="margin-bottom:8px;">
                    <label style="color:#a1a1aa;">Título de la App:</label>
                    <input type="text" id="editAppTitle" style="width:100%; box-sizing:border-box; margin-top:2px;" onchange="guardarNombresEstructurales()">
                </div>
                <div class="inputs-row-grid">
                    <div>
                        <label style="color:#a1a1aa;">Pestaña 1 (Cyan):</label>
                        <input type="text" id="editTab1" style="width:100%; box-sizing:border-box;" onchange="guardarNombresEstructurales()">
                    </div>
                    <div>
                        <label style="color:#a1a1aa;">Pestaña 2 (Morado):</label>
                        <input type="text" id="editTab2" style="width:100%; box-sizing:border-box;" onchange="guardarNombresEstructurales()">
                    </div>
                    <div style="grid-column: span 2;">
                        <label style="color:#a1a1aa;">Pestaña 3 (Rosa):</label>
                        <input type="text" id="editTab3" style="width:100%; box-sizing:border-box;" onchange="guardarNombresEstructurales()">
                    </div>
                </div>
            </div>

            <!-- 2. Modificar Opciones del Desplegable Actual -->
            <div class="panel-section">
                <h4>🔧 Opciones del Desplegable (Pestaña Activa)</h4>
                <div style="display:flex; gap:8px;">
                    <input type="text" id="nuevaOptInput" placeholder="Ej: Ropa, Dulces, Marcas..." style="flex:1;">
                    <button onclick="agregarNuevaOpcion()" style="background:#fff; color:#000; border:none; padding:0 15px; border-radius:4px; font-weight:bold; cursor:pointer;">+</button>
                </div>
                <div class="manager-list" id="managerList"></div>
            </div>

            <!-- 3. Modificar Opciones de Importancia e Importancia Mood -->
            <div class="panel-section">
                <h4>🔥 Editar Lista de Importancia / Niveles</h4>
                <div style="display:flex; gap:8px; margin-bottom:8px;">
                    <input type="text" id="nuevaImportanciaInput" placeholder="Ej: ⭐ Detalle casual, 🔥 Obsesión..." style="flex:1;">
                    <button onclick="agregarItemConfig('nivelesImportancia', 'nuevaImportanciaInput')" style="background:#fff; color:#000; border:none; padding:0 15px; border-radius:4px; font-weight:bold; cursor:pointer;">+</button>
                </div>
                <div class="manager-list" id="importanciaList"></div>
            </div>

            <div class="panel-section">
                <h4>😊 Editar Lista de Contexto / Moods</h4>
                <div style="display:flex; gap:8px;">
                    <input type="text" id="nuevoMoodInput" placeholder="Ej: 😊 Feliz, 🍕 Con antojo..." style="flex:1;">
                    <button onclick="agregarItemConfig('moods', 'nuevoMoodInput')" style="background:#fff; color:#000; border:none; padding:0 15px; border-radius:4px; font-weight:bold; cursor:pointer;">+</button>
                </div>
                <div class="manager-list" id="moodsList"></div>
            </div>

        </div>
        <!-- ============================================================================= -->

        <div class="form-group">
            <label for="obsesion">Nivel de Importancia / Interés:</label>
            <select id="obsesion">
                <!-- Dinámico -->
            </select>
        </div>

        <div class="form-group">
            <label for="mood">Humor / Contexto:</label>
            <select id="mood">
                <!-- Dinámico -->
            </select>
        </div>

        <div class="form-group">
            <label for="imagenInput">📸 Foto / Evidencia (Opcional):</label>
            <input type="file" id="imagenInput" accept="image/*" style="font-size:12px; padding:10px;">
        </div>

        <div class="form-group full-width">
            <label for="detalle">Contenido del Registro:</label>
            <textarea id="detalle" rows="2" placeholder="Escribe el dato exacto aquí..."></textarea>
        </div>

        <button class="btn-guardar" onclick="procesarYGuardar()">Guardar Registro Permanente</button>
    </div>

    <!-- Buscador Integrado -->
    <div style="margin: 20px 0 10px 0;">
        <input type="text" id="buscador" onkeyup="filtrarNotas()" placeholder="🔍 Escanear palabras clave en esta sección..." style="width:100%; box-sizing:border-box;">
    </div>

    <!-- Contenedor de Tarjetas -->
    <div class="notas-grid" id="listaNotas"></div>
</div>

<script>
    // Configuración estructural por defecto editable
    const configPorDefecto = {
        tituloApp: "REGISTROS CORE",
        nombresTabs: {
            seccion1: "Favoritos",
            seccion2: "Planes",
            seccion3: "Alertas / No"
        },
        opcionesSub: {
            seccion1: ["Comida 🍔", "Música 🎵", "Color 🎨", "Dulces 🍫"],
            seccion2: ["Pelis / Series 🍿", "Lugares por ir ✈️", "Planes juntos 🧗"],
            seccion3: ["Disgustos 🤢", "Alergias 💊", "Fechas Peligro 📅"]
        },
        nivelesImportancia: [
            "⚡ Casual / Detalle Simple",
            "⭐⭐ Le gusta bastante",
            "🔥🔥 Interés Extremo"
        ],
        moods: [
            "😊 Feliz / Tranquila",
            "🍕 Con Antojo",
            "🥱 Charla Casual",
            "🔥 Molesta / Queja"
        ]
    };

    let appConfig = {};
    let seccionActual = "seccion1";

    document.addEventListener("DOMContentLoaded", () => {
        const localConfig = localStorage.getItem("masterAppConfig");
        if (localConfig) {
            appConfig = JSON.parse(localConfig);
        } else {
            appConfig = JSON.parse(JSON.stringify(configPorDefecto));
            localStorage.setItem("masterAppConfig", JSON.stringify(appConfig));
        }

        aplicarConfiguracionEstructural();
        inicializarSelectoresMecanicos();
        mostrarNotas();
        loadCustomBg();
    });

    // Carga los nombres editados en los componentes visuales de la App
    function aplicarConfiguracionEstructural() {
        document.getElementById("app-title").textContent = appConfig.tituloApp;
        document.getElementById("btn-seccion1").textContent = appConfig.nombresTabs.seccion1;
        document.getElementById("btn-seccion2").textContent = appConfig.nombresTabs.seccion2;
        document.getElementById("btn-seccion3").textContent = appConfig.nombresTabs.seccion3;

        // Cargar inputs del panel máster con los nombres actuales
        document.getElementById("editAppTitle").value = appConfig.tituloApp;
        document.getElementById("editTab1").value = appConfig.nombresTabs.seccion1;
        document.getElementById("editTab2").value = appConfig.nombresTabs.seccion2;
        document.getElementById("editTab3").value = appConfig.nombresTabs.seccion3;
    }

    function cambiarPestaña(idSeccion) {
        seccionActual = idSeccion;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`btn-${idSeccion}`).classList.add('active');
        
        document.getElementById("masterPanel").style.display = "none";

        inicializarSelectoresMecanicos();
        mostrarNotas();
    }

    // Genera las opciones de los selects desplegables basados en la configuración editable
    function inicializarSelectoresMecanicos() {
        // 1. Subcategorías de la pestaña activa
        const subCatSelect = document.getElementById("subCategoria");
        subCatSelect.innerHTML = "";
        document.getElementById("label-dinamico").textContent = `Categoría [${appConfig.nombresTabs[seccionActual]}]:`;
        appConfig.opcionesSub[seccionActual].forEach(opt => {
            subCatSelect.innerHTML += `<option value="${opt}">${opt}</option>`;
        });

        // 2. Desplegable de Niveles de Importancia
        const obsesionSelect = document.getElementById("obsesion");
        obsesionSelect.innerHTML = "";
        appConfig.nivelesImportancia.forEach(niv => {
            obsesionSelect.innerHTML += `<option value="${niv}">${niv}</option>`;
        });

        // 3. Desplegable de Moods
        const moodSelect = document.getElementById("mood");
        moodSelect.innerHTML = "";
        appConfig.moods.forEach(m => {
            moodSelect.innerHTML += `<option value="${m}">${m}</option>`;
        });

        renderizarListasPanelMaster();
    }

    function toggleMasterPanel() {
        const panel = document.getElementById("masterPanel");
        panel.style.display = (panel.style.display === "block") ? "none" : "block";
    }

    // Guarda los cambios escritos en los inputs de los nombres principales
    function guardarNombresEstructurales() {
        appConfig.tituloApp = document.getElementById("editAppTitle").value.trim() || "MIS REGISTROS";
        appConfig.nombresTabs.seccion1 = document.getElementById("editTab1").value.trim() || "Sección 1";
        appConfig.nombresTabs.seccion2 = document.getElementById("editTab2").value.trim() || "Sección 2";
        appConfig.nombresTabs.seccion3 = document.getElementById("editTab3").value.trim() || "Sección 3";

        localStorage.setItem("masterAppConfig", JSON.stringify(appConfig));
        aplicarConfiguracionEstructural();
        document.getElementById("label-dinamico").textContent = `Categoría [${appConfig.nombresTabs[seccionActual]}]:`;
    }

    // Renderiza las colecciones de botones 'X' dentro del panel máster
    function renderizarListasPanelMaster() {
        // Listar subcategorías
        const containerSub = document.getElementById("managerList");
        containerSub.innerHTML = "";
        appConfig.opcionesSub[seccionActual].forEach((opt, index) => {
            containerSub.innerHTML += `<div class="manager-item"><span>${opt}</span><span class="delete-opt" onclick="eliminarSubCategoria(${index})">×</span></div>`;
        });

        // Listar Niveles de Importancia
        const containerImp = document.getElementById("importanciaList");
        containerImp.innerHTML = "";
        appConfig.nivelesImportancia.forEach((opt, index) => {
            containerImp.innerHTML += `<div class="manager-item"><span>${opt}</span><span class="delete-opt" onclick="eliminarItemConfig('nivelesImportancia', ${index})">×</span></div>`;
        });

        // Listar Moods
        const containerMoods = document.getElementById("moodsList");
        containerMoods.innerHTML = "";
        appConfig.moods.forEach((opt, index) => {
            containerMoods.innerHTML += `<div class="manager-item"><span>${opt}</span><span class="delete-opt" onclick="eliminarItemConfig('moods', ${index})">×</span></div>`;
        });
    }

    // Funciones de alteración de arreglos desde el Panel Máster
    function agregarNuevaOpcion() {
        const input = document.getElementById("nuevaOptInput");
        const valor = input.value.trim();
        if (valor && !appConfig.opcionesSub[seccionActual].includes(valor)) {
            appConfig.opcionesSub[seccionActual].push(valor);
            localStorage.setItem("masterAppConfig", JSON.stringify(appConfig));
            input.value = "";
            inicializarSelectoresMecanicos();
        }
    }

    function eliminarSubCategoria(index) {
        appConfig.opcionesSub[seccionActual].splice(index, 1);
        localStorage.setItem("masterAppConfig", JSON.stringify(appConfig));
        inicializarSelectoresMecanicos();
    }

    function agregarItemConfig(llaveArray, inputId) {
        const input = document.getElementById(inputId);
        const valor = input.value.trim();
        if (valor && !appConfig[llaveArray].includes(valor)) {
            appConfig[llaveArray].push(valor);
            localStorage.setItem("masterAppConfig", JSON.stringify(appConfig));
            input.value = "";
            inicializarSelectoresMecanicos();
        }
    }

    function eliminarItemConfig(llaveArray, index) {
        appConfig[llaveArray].splice(index, 1);
        localStorage.setItem("masterAppConfig", JSON.stringify(appConfig));
        inicializarSelectoresMecanicos();
    }

    // --- LÓGICA DE PROCESAMIENTO DE REGISTROS ---
    function procesarYGuardar() {
        const subCategoria = document.getElementById("subCategoria").value;
        const obsesion = document.getElementById("obsesion").value;
        const mood = document.getElementById("mood").value;
        const detalle = document.getElementById("detalle").value;
        const archivoImagen = document.getElementById("imagenInput").files[0];

        if (!subCategoria || detalle.trim() === "") { alert("Completa los datos del registro."); return; }

        if (archivoImagen) {
            const lector = new FileReader();
            lector.onloadend = () => guardarNotaFinal(subCategoria, obsesion, mood, detalle, lector.result);
            lector.readAsDataURL(archivoImagen);
        } else {
            guardarNotaFinal(subCategoria, obsesion, mood, detalle, null);
        }
    }

    function guardarNotaFinal(subCat, obs, md, det, imgBase64) {
        const nuevaNota = {
            id: Date.now(),
            seccionId: seccionActual,
            subCategoria: subCat,
            obsesion: obs,
            mood: md,
            detalle: det,
            imagen: imgBase64,
            fecha: new Date().toLocaleDateString('es-MX', { month: 'short', day: 'numeric' })
        };

        let notas = JSON.parse(localStorage.getItem("masterAppNotas")) || [];
        notas.push(nuevaNota);
        localStorage.setItem("masterAppNotas", JSON.stringify(notas));
        
        document.getElementById("detalle").value = "";
        document.getElementById("imagenInput").value = "";
        mostrarNotas();
    }

    function mostrarNotas() {
        const lista = document.getElementById("listaNotas");
        lista.innerHTML = "";
        
        let notas = JSON.parse(localStorage.getItem("masterAppNotas")) || [];
        let notasFiltradas = notas.filter(n => n.seccionId === seccionActual);

        if (notasFiltradas.length === 0) {
            lista.innerHTML = `<p style='color:var(--text-muted); text-align:center; grid-column:span 2; padding:30px;'>Sin registros archivados en este espacio.</p>`;
            return;
        }

        notasFiltradas.reverse().forEach(nota => {
            let imgHtml = nota.imagen ? `<img src="${nota.imagen}">` : '';
            
            lista.innerHTML += `
                <div class="nota-card item-nota card-${seccionActual}" data-texto="${nota.detalle.toLowerCase()} ${nota.subCategoria.toLowerCase()}">
                    <button class="btn-borrar" onclick="borrarNota(${nota.id})">×</button>
                    <div>
                        <p style="margin:5px 0 15px 0; font-size:14px; line-height:1.5; font-weight:500;">${nota.detalle}</p>
                        ${imgHtml}
                    </div>
                    <div class="sub-info">
                        <span>📁 ${nota.subCategoria}</span>
                        <span>${nota.obsesion}</span>
                        <span>${nota.mood}</span>
                        <span>📅 ${nota.fecha}</span>
                    </div>
                </div>
            `;
        });
    }

    function filtrarNotas() {
        const query = document.getElementById("buscador").value.toLowerCase();
        const items = document.querySelectorAll(".item-nota");
        items.forEach(item => {
            item.style.display = item.getAttribute("data-texto").includes(query) ? "flex" : "none";
        });
    }

    function borrarNota(id) {
        if(confirm("¿Eliminar este registro permanente de la base de datos?")) {
            let notas = JSON.parse(localStorage.getItem("masterAppNotas")) || [];
            notas = notas.filter(nota => nota.id !== id);
            localStorage.setItem("masterAppNotas", JSON.stringify(notas));
            mostrarNotas();
        }
    }

    // --- Control del Fondo (Filtro blur elegante, sin saturación) ---
    const bgInput = document.getElementById('bgInput');
    const bodyBgLayer = document.getElementById('body-bg-layer');
    const toggleBg = document.getElementById('toggleBg');

    bgInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                localStorage.setItem('masterAppBgImg', e.target.result);
                applyBgImage(e.target.result);
                toggleBg.checked = true;
                localStorage.setItem('masterAppUseBg', 'true');
            }
            reader.readAsDataURL(file);
        }
    });

    function applyBgImage(imgData) {
        bodyBgLayer.style.backgroundImage = `url(${imgData})`;
        bodyBgLayer.style.display = 'block';
    }

    function toggleCustomBg() {
        if (toggleBg.checked) {
            const storedImg = localStorage.getItem('masterAppBgImg');
            if (storedImg) { bodyBgLayer.style.display = 'block'; localStorage.setItem('masterAppUseBg', 'true'); }
            else { alert("Sube un archivo de imagen válido primero."); toggleBg.checked = false; }
        } else {
            bodyBgLayer.style.display = 'none'; localStorage.setItem('masterAppUseBg', 'false');
        }
    }

    function loadCustomBg() {
        const storedImg = localStorage.getItem('masterAppBgImg');
        const useCustom = localStorage.getItem('masterAppUseBg');
        if (storedImg) applyBgImage(storedImg);
        if (useCustom === 'true') { toggleBg.checked = true; bodyBgLayer.style.display = 'block'; }
        else { toggleBg.checked = false; bodyBgLayer.style.display = 'none'; }
    }

    // --- Sistema Integral de Backups Completo ---
    function exportarTodo() {
        const notas = localStorage.getItem("masterAppNotas") || "[]";
        const configuracion = localStorage.getItem("masterAppConfig") || "{}";
        const payloadTotal = { notas: JSON.parse(notas), configuracion: JSON.parse(configuracion) };
        
        const blob = new Blob([JSON.stringify(payloadTotal)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `backup_sistema_maestro.json`;
        a.click();
    }

    function importarTodo(input) {
        const archivo = input.files[0];
        if (!archivo) return;
        const lector = new FileReader();
        lector.onload = function(e) {
            try {
                const payloadTotal = JSON.parse(e.target.result);
                if (payloadTotal.notas && payloadTotal.configuracion) {
                    localStorage.setItem("masterAppNotas", JSON.stringify(payloadTotal.notas));
                    localStorage.setItem("masterAppConfig", JSON.stringify(payloadTotal.configuracion));
                    appConfig = payloadTotal.configuracion;
                    
                    aplicarConfiguracionEstructural();
                    inicializarSelectoresMecanicos();
                    mostrarNotas();
                    alert("¡Sistema Maestro restaurado y actualizado al 100%!");
                }
            } catch (err) { alert("Error crítico al procesar el archivo JSON."); }
        };
        lector.readAsText(archivo);
    }
</script>
