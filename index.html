<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Amor ❤</title>
    <style>
        :root {
            --bg-default: linear-gradient(135deg, #0f172a, #1e293b);
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #f472b6; /* Un rosa suave */
            --input-bg: rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-default);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            position: relative;
        }

        /* Capa para el fondo con imagen personalizada */
        #body-bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(15px); /* Desenfoque sutil */
            opacity: 1.0; /* Ajusta la opacidad para que no compita con el texto */
            z-index: -1; /* Envía la imagen detrás de todo */
            display: none; /* Oculto por defecto */
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
            z-index: 1; /* Asegura que el contenido esté al frente */
        }

        h1 {
            text-align: center;
            margin-top: 0;
            font-weight: 700;
            font-size: 2.5rem;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(244, 114, 182, 0.3);
        }

        .grid-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .grid-form { grid-template-columns: 1fr; }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 12px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }
        @media (max-width: 600px) {
            .form-group.full-width { grid-column: span 1; }
        }

        label {
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        input, select, textarea {
            padding: 12px;
            border: 1px solid var(--card-border);
            background-color: var(--input-bg);
            color: var(--text-main);
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        button.btn-guardar {
            grid-column: span 2;
            padding: 15px;
            background-color: var(--accent);
            color: #1e293b;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        @media (max-width: 600px) { button.btn-guardar { grid-column: span 1; } }

        button.btn-guardar:hover {
            background-color: #fca5a5;
        }

        .search-box {
            margin: 30px 0 20px 0;
        }

        .notas-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        @media (max-width: 768px) { .notas-grid { grid-template-columns: 1fr; } }

        .nota-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 14px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .nota-card img {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 10px;
        }

        .btn-borrar {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 18px;
        }

        .badge-cat {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
            text-transform: uppercase;
            width: max-content;
            margin-bottom: 8px;
        }
        .cat-gustos { background: rgba(244, 114, 182, 0.15); color: var(--accent); border: 1px solid var(--accent); }
        .cat-descubrir { background: rgba(147, 197, 253, 0.15); color: #93c5fd; border: 1px solid #93c5fd; }
        .cat-alertas { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid #fca5a5; }

        .sub-info {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
            display: flex;
            gap: 10px;
        }

        /* Sección de foto de fondo */
        .settings-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid var(--card-border);
        }
        .settings-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }
    </style>
</head>
<body>

    <div id="body-bg-layer"></div>

<div class="container">
    <h1>Mi Amor ❤</h1>

    <div class="settings-section">
        <label>🖼 Foto de Fondo Custom</label>
        <div class="settings-controls">
            <input type="file" id="bgInput" accept="image/*" style="width: auto; padding: 5px; font-size: 12px;">
            <div style="font-size: 12px;">
                <label for="toggleBg" style="display:inline; text-transform:none; font-weight: normal; margin-right:5px;">Activar:</label>
                <input type="checkbox" id="toggleBg" onchange="toggleCustomBg()" style="width:auto; cursor:pointer;">
            </div>
        </div>
    </div>
    
    <div class="grid-form">
        <div class="form-group">
            <label for="categoria">¿Qué tipo de detalle?</label>
            <select id="categoria" onchange="adaptarFormulario()">
                <option value="Gustos">Favs (Clima, comida, color...)</option>
                <option value="Por Descubrir">Planes, series o pelis x ver</option>
                <option value="Alertas">Cosas que NO (Alergias, disgustos...)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="subCategoria">Especifica:</label>
            <select id="subCategoria">
                </select>
        </div>

        <div class="form-group full-width">
            <label for="detalle">Cuéntame el detalle:</label>
            <textarea id="detalle" rows="2" placeholder="Escribe aquí..."></textarea>
        </div>

        <div class="form-group full-width">
            <label for="imagenInput">📸 Pon una foto de referencia (opcional):</label>
            <input type="file" id="imagenInput" accept="image/*">
        </div>

        <button class="btn-guardar" onclick="procesarYGuardar()">Guardar Detalle ❤</button>
    </div>

    <div class="search-box">
        <label for="buscador">🔍 Busca rápido:</label>
        <input type="text" id="buscador" onkeyup="filtrarNotas()" placeholder="Ej: clima, rosa, alergia...">
    </div>

    <div class="notas-grid" id="listaNotas"></div>
</div>

<script>
    const subCategoriasPorDefecto = {
        "Gustos": ["Clima ❄️/☀️", "Comida 🍔", "Color 🎨", "Música 🎵", "Ropa 👗", "Hobbies 🎮"],
        "Por Descubrir": ["Pelis / Series 🍿", "Libros 📚", "Viajes / Lugares ✈️", "Planes 🧗"],
        "Alertas": ["Disgustos / Odia 🤢", "Alergias 💊", "Fechas Clave 📅"]
    };

    document.addEventListener("DOMContentLoaded", () => {
        adaptarFormulario();
        mostrarNotas();
        loadCustomBg(); // Cargar la foto de fondo si ya existe
    });

    function adaptarFormulario() {
        const catPrincipal = document.getElementById("categoria").value;
        const subCatSelect = document.getElementById("subCategoria");
        subCatSelect.innerHTML = "";
        subCategoriasPorDefecto[catPrincipal].forEach(sub => {
            let option = document.createElement("option");
            option.value = sub;
            option.textContent = sub;
            subCatSelect.appendChild(option);
        });
    }

    function procesarYGuardar() {
        const categoria = document.getElementById("categoria").value;
        const subCategoria = document.getElementById("subCategoria").value;
        const detalle = document.getElementById("detalle").value;
        const archivoImagen = document.getElementById("imagenInput").files[0];

        if (detalle.trim() === "") { alert("Escribe el detalle."); return; }

        if (archivoImagen) {
            const lector = new FileReader();
            lector.onloadend = () => guardarNotaFinal(categoria, subCategoria, detalle, lector.result);
            lector.readAsDataURL(archivoImagen);
        } else {
            guardarNotaFinal(categoria, subCategoria, detalle, null);
        }
    }

    function guardarNotaFinal(cat, subCat, det, imgBase64) {
        const nuevaNota = { id: Date.now(), categoria: cat, subCategoria: subCat, detalle: det, imagen: imgBase64, fecha: new Date().toLocaleDateString() };
        let notas = JSON.parse(localStorage.getItem("misNotasAmore")) || [];
        notas.push(nuevaNota);
        localStorage.setItem("misNotasAmore", JSON.stringify(notas));
        document.getElementById("detalle").value = "";
        document.getElementById("imagenInput").value = "";
        mostrarNotas();
    }

    function mostrarNotas() {
        const lista = document.getElementById("listaNotas");
        lista.innerHTML = "";
        let notas = JSON.parse(localStorage.getItem("misNotasAmore")) || [];
        if (notas.length === 0) { lista.innerHTML = "<p style='color:var(--text-muted); text-align:center; grid-column:span 2;'>Sin detalles aún.</p>"; return; }
        notas.reverse().forEach(nota => {
            let claseEstilo = "cat-gustos";
            if (nota.categoria === "Por Descubrir") claseEstilo = "cat-descubrir";
            if (nota.categoria === "Alertas") claseEstilo = "cat-alertas";
            let imgHtml = nota.imagen ? `<img src="${nota.imagen}">` : '';
            lista.innerHTML += `<div class="nota-card item-nota" data-texto="${nota.detalle.toLowerCase()} ${nota.categoria.toLowerCase()} ${nota.subCategoria.toLowerCase()}"> <button class="btn-borrar" onclick="borrarNota(${nota.id})">×</button> <div> <span class="badge-cat ${claseEstilo}">${nota.categoria}</span> <p style="margin:10px 0;">${nota.detalle}</p> ${imgHtml} </div> <div class="sub-info"> <span>📁 ${nota.subCategoria}</span> <span>📅 ${nota.fecha}</span> </div> </div>`;
        });
    }

    function filtrarNotas() {
        const query = document.getElementById("buscador").value.toLowerCase();
        const items = document.querySelectorAll(".item-nota");
        items.forEach(item => { item.style.display = item.getAttribute("data-texto").includes(query) ? "flex" : "none"; });
    }

    function borrarNota(id) {
        if(confirm("¿Borrar este detalle?")) {
            let notas = JSON.parse(localStorage.getItem("misNotasAmore")) || [];
            notas = notas.filter(nota => nota.id !== id);
            localStorage.setItem("misNotasAmore", JSON.stringify(notas));
            mostrarNotas();
        }
    }

    // Funciones para la imagen de fondo personalizada
    const bgInput = document.getElementById('bgInput');
    const bodyBgLayer = document.getElementById('body-bg-layer');
    const toggleBg = document.getElementById('toggleBg');

    bgInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Image = e.target.result;
                localStorage.setItem('customBgImage', base64Image);
                applyBgImage(base64Image);
                toggleBg.checked = true; // Activar el toggle automáticamente
                localStorage.setItem('useCustomBg', 'true');
            }
            reader.readAsDataURL(file);
        }
    });

    function applyBgImage(imgData) {
        bodyBgLayer.style.backgroundImage = `url(${imgData})`;
        bodyBgLayer.style.display = 'block';
    }

    function toggleCustomBg() {
        if (toggleBg.checked) {
            const storedImg = localStorage.getItem('customBgImage');
            if (storedImg) {
                bodyBgLayer.style.display = 'block';
                localStorage.setItem('useCustomBg', 'true');
            } else {
                alert("Primero sube una foto.");
                toggleBg.checked = false;
            }
        } else {
            bodyBgLayer.style.display = 'none';
            localStorage.setItem('useCustomBg', 'false');
        }
    }

    function loadCustomBg() {
        const storedImg = localStorage.getItem('customBgImage');
        const useCustom = localStorage.getItem('useCustomBg');
        if (storedImg) { applyBgImage(storedImg); }
        if (useCustom === 'true') { toggleBg.checked = true; bodyBgLayer.style.display = 'block'; }
        else { toggleBg.checked = false; bodyBgLayer.style.display = 'none'; }
    }
</script>

</body>
</html>
