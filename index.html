<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de Datos Personal</title>
    <style>
        :root {
            --bg-default: #0f141c;
            --card-bg: rgba(22, 28, 38, 0.9);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            
            /* Colores de acento limpios */
            --color-gustos: #00ffcc;
            --color-descubrir: #b55fe6;
            --color-alertas: #ff3b6f;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-default);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        #body-bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(15px);
            opacity: 0.3;
            z-index: -1;
            display: none;
        }

        .container {
            max-width: 850px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin-top: 0;
            font-weight: 700;
            font-size: 2.2rem;
            letter-spacing: -0.5px;
            color: #fff;
        }

        /* Sistema de Pestañas Dinámicas */
        .tabs-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: transform 0.1s, background 0.2s;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        /* Colores asignados dinámicamente cuando están activos */
        .tab-btn.active[data-tab="seccion1"] { background: var(--color-gustos); color: #000; border-color: var(--color-gustos); }
        .tab-btn.active[data-tab="seccion2"] { background: var(--color-descubrir); color: #fff; border-color: var(--color-descubrir); }
        .tab-btn.active[data-tab="seccion3"] { background: var(--color-alertas); color: #fff; border-color: var(--color-alertas); }

        /* Formulario */
        .grid-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        @media (max-width: 600px) { .grid-form { grid-template-columns: 1fr; } }

        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: span 2; }
        @media (max-width: 600px) { .form-group.full-width { grid-column: span 1; } }

        label {
            margin-bottom: 6px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            padding: 12px;
            border: 1px solid var(--border-color);
            background-color: #0b0f15;
            color: var(--text-main);
            border-radius: 8px;
            font-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #fff;
        }

        .select-with-btn { display: flex; gap: 8px; }
        .select-with-btn select { flex: 1; }
        
        .btn-gear {
            background: #1e2530;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 8px;
            padding: 0 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        .btn-gear:hover { background: #2d3748; }

        button.btn-guardar {
            grid-column: span 2;
            padding: 14px;
            background-color: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        @media (max-width: 600px) { button.btn-guardar { grid-column: span 1; } }
        button.btn-guardar:hover { background-color: #e2e8f0; }

        /* Panel de Configuración Avanzado (Editor de nombres y opciones) */
        .manager-panel {
            display: none;
            grid-column: span 2;
            background: #131922;
            border: 1px dashed var(--text-muted);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        @media (max-width: 600px) { .manager-panel { grid-column: span 1; } }

        .manager-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .manager-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .manager-item {
            background: #1e2530;
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .manager-item span.delete-opt { color: var(--color-alertas); cursor: pointer; font-weight: bold; }

        /* Estructura de las Tarjetas */
        .notas-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 20px;
        }
        @media (max-width: 768px) { .notas-grid { grid-template-columns: 1fr; } }

        .nota-card {
            background: #141a24;
            padding: 18px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Colores Dinámicos en los Bordes de las Tarjetas */
        .nota-card.card-seccion1 { border-left: 4px solid var(--color-gustos); }
        .nota-card.card-seccion2 { border-left: 4px solid var(--color-descubrir); }
        .nota-card.card-seccion3 { border-left: 4px solid var(--color-alertas); }

        .nota-card img {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 6px;
            margin-top: 12px;
        }

        .btn-borrar {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 18px;
        }
        .btn-borrar:hover { color: var(--color-alertas); }

        .sub-info {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 12px;
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .sub-info span {
            background: rgba(255,255,255,0.03);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        /* Barra Config de Fondo */
        .settings-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            width: 100%;
            box-sizing: border-box;
            gap: 10px;
            flex-wrap: wrap;
        }
        .backup-btns button {
            background: #1e2530;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }
        .backup-btns button:hover { background: #2d3748; }
    </style>
</head>
<body>

    <div id="body-bg-layer"></div>

<div class="container">
    <h1 id="app-title">REGISTROS ❤</h1>

    <!-- Configuración Superior -->
    <div class="settings-section">
        <div style="display:flex; align-items:center; gap:8px;">
            <label style="margin:0;">🖼 Fondo:</label>
            <input type="file" id="bgInput" accept="image/*" style="display:none;">
            <button onclick="document.getElementById('bgInput').click()" style="background:#1e2530; color:white; border:1px solid var(--border-color); padding:5px 10px; border-radius:6px; font-size:11px; cursor:pointer;">Subir Imagen</button>
            <input type="checkbox" id="toggleBg" onchange="toggleCustomBg()" style="cursor:pointer;">
        </div>
        <div class="backup-btns">
            <button onclick="exportarDatos()">📥 Guardar Respaldo</button>
            <button onclick="document.getElementById('importInput').click()">📤 Cargar Respaldo</button>
            <input type="file" id="importInput" accept=".json" style="display:none;" onchange="importarDatos(this)">
        </div>
    </div>

    <!-- PESTAÑAS (Botones principales cuyos nombres ahora puedes editar) -->
    <div class="tabs-container" id="tabsLayout">
        <button class="tab-btn active" data-tab="seccion1" id="btn-seccion1" onclick="cambiarPestaña('seccion1')">Favoritos</button>
        <button class="tab-btn" data-tab="seccion2" id="btn-seccion2" onclick="cambiarPestaña('seccion2')">Planes</button>
        <button class="tab-btn" data-tab="seccion3" id="btn-seccion3" onclick="cambiarPestaña('seccion3')">Alertas / No</button>
    </div>
    
    <!-- Formulario Organizado -->
    <div class="grid-form">
        
        <div class="form-group">
            <label id="label-dinamico">Tipo de Registro:</label>
            <div class="select-with-btn">
                <select id="subCategoria">
                    <!-- Dinámico -->
                </select>
                <button class="btn-gear" onclick="toggleManagerPanel()">⚙ MODO EDIT</button>
            </div>
        </div>

        <!-- PANEL DE CONTROL AVANZADO (Edita nombres de pestañas y subcategorías aquí) -->
        <div class="manager-panel" id="managerPanel">
            <!-- 1. Editar Nombre de la pestaña actual -->
            <div class="manager-row">
                <label style="color: #fff;">✏️ Cambiar nombre a esta Pestaña:</label>
                <div style="display:flex; gap:8px; margin-top:4px;">
                    <input type="text" id="editNombreTabInput" placeholder="Nuevo nombre de la pestaña...">
                    <button onclick="renombrarPestañaActual()" style="background:#22c55e; color:white; border:none; padding:0 12px; border-radius:6px; font-weight:bold; cursor:pointer;">Guardar Nombre</button>
                </div>
            </div>

            <!-- 2. Administrar Subcategorías -->
            <div>
                <label style="color: #fff;">🔧 Añadir Opción Desplegable:</label>
                <div style="display:flex; gap:8px; margin-top:4px;">
                    <input type="text" id="nuevaOptInput" placeholder="Ej: Ropa, Dulces, Series...">
                    <button onclick="agregarNuevaOpcion()" style="background:#fff; color:#000; border:none; padding:0 15px; border-radius:6px; font-weight:bold; cursor:pointer;">+</button>
                </div>
                <div class="manager-list" id="managerList">
                    <!-- Lista con botones X -->
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="obsesion">Nivel de Importancia / Interés:</label>
            <select id="obsesion">
                <option value="⚡ Casual / Detalle Simple">⚡ Casual / Detalle Simple</option>
                <option value="⭐⭐ Le gusta bastante">⭐⭐ Le gusta bastante</option>
                <option value="🔥🔥 Interés Extremo" selected>🔥🔥 Interés Extremo</option>
            </select>
        </div>

        <div class="form-group">
            <label for="mood">Humor / Contexto:</label>
            <select id="mood">
                <option value="😊 Feliz / Tranquila">😊 Feliz / Tranquila</option>
                <option value="🍕 Con Antojo">🍕 Con Antojo</option>
                <option value="🥱 Charla Casual">🥱 Charla Casual</option>
                <option value="🔥 Molesta / Queja">🔥 Molesta / Queja</option>
            </select>
        </div>

        <div class="form-group">
            <label for="imagenInput">📸 Foto / Evidencia (Opcional):</label>
            <input type="file" id="imagenInput" accept="image/*" style="font-size:12px; padding:10px;">
        </div>

        <div class="form-group full-width">
            <label for="detalle">Detalle del registro (¿Qué pasó o qué te dijo?):</label>
            <textarea id="detalle" rows="2" placeholder="Escribe el dato aquí..."></textarea>
        </div>

        <button class="btn-guardar" onclick="procesarYGuardar()">Guardar Datos Core</button>
    </div>

    <!-- Buscador Integrado -->
    <div style="margin: 20px 0 10px 0;">
        <input type="text" id="buscador" onkeyup="filtrarNotas()" placeholder="🔍 Buscar palabras clave en esta sección..." style="width:100%; box-sizing:border-box;">
    </div>

    <!-- Muestra de Tarjetas -->
    <div class="notas-grid" id="listaNotas"></div>
</div>

<script>
    // Configuración inicial por defecto
    const estructuraInicial = {
        nombresTabs: {
            seccion1: "Favoritos",
            seccion2: "Planes",
            seccion3: "Alertas / No"
        },
        opciones: {
            seccion1: ["Comida 🍔", "Música 🎵", "Color 🎨", "Dulces 🍫"],
            seccion2: ["Pelis / Series 🍿", "Lugares por ir ✈️", "Planes juntos 🧗"],
            seccion3: ["Disgustos 🤢", "Alergias 💊", "Fechas Clave 📅"]
        }
    };

    let appData = {};
    let seccionActual = "seccion1";

    document.addEventListener("DOMContentLoaded", () => {
        const datosGuardados = localStorage.getItem("appDataConfigurable");
        if (datosGuardados) {
            appData = JSON.parse(datosGuardados);
        } else {
            appData = JSON.parse(JSON.stringify(estructuraInicial));
            localStorage.setItem("appDataConfigurable", JSON.stringify(appData));
        }

        renderizarNombresPestañas();
        inicializarSelectores();
        mostrarNotas();
        loadCustomBg();
    });

    // Actualiza los textos de los botones superiores según lo que hayas editado
    function renderizarNombresPestañas() {
        document.getElementById("btn-seccion1").textContent = appData.nombresTabs.seccion1;
        document.getElementById("btn-seccion2").textContent = appData.nombresTabs.seccion2;
        document.getElementById("btn-seccion3").textContent = appData.nombresTabs.seccion3;
    }

    function cambiarPestaña(idSeccion) {
        seccionActual = idSeccion;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`btn-${idSeccion}`).classList.add('active');
        
        document.getElementById("managerPanel").style.display = "none";

        inicializarSelectores();
        mostrarNotas();
    }

    function inicializarSelectores() {
        const subCatSelect = document.getElementById("subCategoria");
        subCatSelect.innerHTML = "";
        
        const nombreVisibleTab = appData.nombresTabs[seccionActual];
        document.getElementById("label-dinamico").textContent = `Categorías de [${nombreVisibleTab}]:`;
        document.getElementById("editNombreTabInput").value = nombreVisibleTab;

        appData.opciones[seccionActual].forEach(opt => {
            let option = document.createElement("option");
            option.value = opt;
            option.textContent = opt;
            subCatSelect.appendChild(option);
        });

        actualizarListaPanelManager();
    }

    function toggleManagerPanel() {
        const panel = document.getElementById("managerPanel");
        panel.style.display = (panel.style.display === "block") ? "none" : "block";
    }

    // RENOMBRAR LA PESTAÑA DESDE LA INTERFAZ
    function renombrarPestañaActual() {
        const input = document.getElementById("editNombreTabInput");
        const nuevoNombre = input.value.trim();
        if (nuevoNombre === "") { alert("El nombre no puede estar vacío."); return; }

        appData.nombresTabs[seccionActual] = nuevoNombre;
        localStorage.setItem("appDataConfigurable", JSON.stringify(appData));
        
        renderizarNombresPestañas();
        inicializarSelectores();
        alert(`Pestaña renombrada a "${nuevoNombre}"`);
    }

    function actualizarListaPanelManager() {
        const listContainer = document.getElementById("managerList");
        listContainer.innerHTML = "";

        appData.opciones[seccionActual].forEach((opt, index) => {
            listContainer.innerHTML += `
                <div class="manager-item">
                    <span>${opt}</span>
                    <span class="delete-opt" onclick="eliminarOpcion(${index})">×</span>
                </div>
            `;
        });
    }

    function agregarNuevaOpcion() {
        const input = document.getElementById("nuevaOptInput");
        const valor = input.value.trim();
        if (valor === "") return;

        if (appData.opciones[seccionActual].includes(valor)) { return; }

        appData.opciones[seccionActual].push(valor);
        localStorage.setItem("appDataConfigurable", JSON.stringify(appData));
        
        input.value = "";
        inicializarSelectores();
    }

    function eliminarOpcion(index) {
        appData.opciones[seccionActual].splice(index, 1);
        localStorage.setItem("appDataConfigurable", JSON.stringify(appData));
        inicializarSelectores();
    }

    function procesarYGuardar() {
        const subCategoria = document.getElementById("subCategoria").value;
        const obsesion = document.getElementById("obsesion").value;
        const mood = document.getElementById("mood").value;
        const detalle = document.getElementById("detalle").value;
        const archivoImagen = document.getElementById("imagenInput").files[0];

        if (!subCategoria || detalle.trim() === "") { alert("Llena los campos obligatorios."); return; }

        if (archivoImagen) {
            const lector = new FileReader();
            lector.onloadend = () => guardarNotaFinal(subCategoria, obsesion, mood, detalle, lector.result);
            lector.readAsDataURL(archivoImagen);
        } else {
            guardarNotaFinal(subCategoria, obsesion, mood, detalle, null);
        }
    }

    function guardarNotaFinal(subCat, obs, md, det, imgBase64) {
        const nuevaNota = {
            id: Date.now(),
            seccionId: seccionActual, // Se liga al identificador interno permanente
            subCategoria: subCat,
            obsesion: obs,
            mood: md,
            detalle: det,
            imagen: imgBase64,
            fecha: new Date().toLocaleDateString('es-MX', { month: 'short', day: 'numeric' })
        };

        let notas = JSON.parse(localStorage.getItem("misNotasConfigurables")) || [];
        notas.push(nuevaNota);
        localStorage.setItem("misNotasConfigurables", JSON.stringify(notas));
        
        document.getElementById("detalle").value = "";
        document.getElementById("imagenInput").value = "";
        mostrarNotas();
    }

    function mostrarNotas() {
        const lista = document.getElementById("listaNotas");
        lista.innerHTML = "";
        
        let notas = JSON.parse(localStorage.getItem("misNotasConfigurables")) || [];
        let notasFiltradas = notas.filter(n => n.seccionId === seccionActual);

        if (notasFiltradas.length === 0) {
            lista.innerHTML = `<p style='color:var(--text-muted); text-align:center; grid-column:span 2; padding:30px;'>No hay datos guardados aquí todavía.</p>`;
            return;
        }

        notasFiltradas.reverse().forEach(nota => {
            let imgHtml = nota.imagen ? `<img src="${nota.imagen}">` : '';
            
            lista.innerHTML += `
                <div class="nota-card item-nota card-${seccionActual}" data-texto="${nota.detalle.toLowerCase()} ${nota.subCategoria.toLowerCase()}">
                    <button class="btn-borrar" onclick="borrarNota(${nota.id})">×</button>
                    <div>
                        <p style="margin:5px 0 15px 0; font-size:14px; line-height:1.5; font-weight:500;">${nota.detalle}</p>
                        ${imgHtml}
                    </div>
                    <div class="sub-info">
                        <span>📁 ${nota.subCategoria}</span>
                        <span>${nota.obsesion}</span>
                        <span>${nota.mood}</span>
                        <span>📅 ${nota.fecha}</span>
                    </div>
                </div>
            `;
        });
    }

    function filtrarNotas() {
        const query = document.getElementById("buscador").value.toLowerCase();
        const items = document.querySelectorAll(".item-nota");
        items.forEach(item => {
            item.style.display = item.getAttribute("data-texto").includes(query) ? "flex" : "none";
        });
    }

    function borrarNota(id) {
        if(confirm("¿Eliminar este registro permanente?")) {
            let notas = JSON.parse(localStorage.getItem("misNotasConfigurables")) || [];
            notas = notas.filter(nota => nota.id !== id);
            localStorage.setItem("misNotasConfigurables", JSON.stringify(notas));
            mostrarNotas();
        }
    }

    // --- Wallpaper Backend ---
    const bgInput = document.getElementById('bgInput');
    const bodyBgLayer = document.getElementById('body-bg-layer');
    const toggleBg = document.getElementById('toggleBg');

    bgInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                localStorage.setItem('customBgConfig', e.target.result);
                applyBgImage(e.target.result);
                toggleBg.checked = true;
                localStorage.setItem('useCustomBgConf', 'true');
            }
            reader.readAsDataURL(file);
        }
    });

    function applyBgImage(imgData) {
        bodyBgLayer.style.backgroundImage = `url(${imgData})`;
        bodyBgLayer.style.display = 'block';
    }

    function toggleCustomBg() {
        if (toggleBg.checked) {
            const storedImg = localStorage.getItem('customBgConfig');
            if (storedImg) { bodyBgLayer.style.display = 'block'; localStorage.setItem('useCustomBgConf', 'true'); }
            else { alert("Primero sube una imagen."); toggleBg.checked = false; }
        } else {
            bodyBgLayer.style.display = 'none'; localStorage.setItem('useCustomBgConf', 'false');
        }
    }

    function loadCustomBg() {
        const storedImg = localStorage.getItem('customBgConfig');
        const useCustom = localStorage.getItem('useCustomBgConf');
        if (storedImg) applyBgImage(storedImg);
        if (useCustom === 'true') { toggleBg.checked = true; bodyBgLayer.style.display = 'block'; }
        else { toggleBg.checked = false; bodyBgLayer.style.display = 'none'; }
    }

    // --- Respaldos Avanzados (Guarda notas + nombres editados + opciones) ---
    function exportarDatos() {
        const notas = localStorage.getItem("misNotasConfigurables") || "[]";
        const configuracion = localStorage.getItem("appDataConfigurable") || "{}";
        const payload = { notas: JSON.parse(notas), configuracion: JSON.parse(configuracion) };
        
        const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `backup_sistema_datos.json`;
        a.click();
    }

    function importarDatos(input) {
        const archivo = input.files[0];
        if (!archivo) return;
        const lector = new FileReader();
        lector.onload = function(e) {
            try {
                const payload = JSON.parse(e.target.result);
                if (payload.notas && payload.configuracion) {
                    localStorage.setItem("misNotasConfigurables", JSON.stringify(payload.notas));
                    localStorage.setItem("appDataConfigurable", JSON.stringify(payload.configuracion));
                    appData = payload.configuracion;
                    renderizarNombresPestañas();
                    inicializarSelectores();
                    mostrarNotas();
                    alert("¡Todo importado y configurado con éxito!");
                }
            } catch (err) { alert("Error en el archivo."); }
        };
        lector.readAsText(archivo);
    }
</script>
