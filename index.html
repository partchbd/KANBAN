<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Master Memory Hub Pro ⚡</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #060c21, #111d4a);
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #a0aec0;
            --neon-blue: #00f2fe;
            --neon-pink: #ff007f;
            --input-bg: rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin-top: 0;
            font-weight: 800;
            font-size: 2.2rem;
            letter-spacing: 1px;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 242, 254, 0.2);
        }

        .grid-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .grid-form { grid-template-columns: 1fr; }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 12px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }
        @media (max-width: 600px) {
            .form-group.full-width { grid-column: span 1; }
        }

        label {
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            padding: 12px;
            border: 1px solid var(--card-border);
            background-color: var(--input-bg);
            color: var(--text-main);
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.4);
        }

        /* Estilo para el input de tipo archivo customizado */
        .file-upload {
            position: relative;
            display: inline-block;
        }

        button.btn-guardar {
            grid-column: span 2;
            padding: 15px;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink));
            color: #060c21;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.3);
            margin-top: 10px;
        }
        @media (max-width: 600px) { button.btn-guardar { grid-column: span 1; } }

        button.btn-guardar:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 0, 127, 0.5);
        }

        .search-box {
            margin: 30px 0 20px 0;
        }

        /* Contenedor de notas en Grid estilo Dashboard */
        .notas-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        @media (max-width: 768px) { .notas-grid { grid-template-columns: 1fr; } }

        .nota-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 16px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            animation: fadeIn 0.4s ease;
        }

        .nota-card img {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-top: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-borrar {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #ff4757;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
        }

        /* Badges de Categorías Estilizados */
        .badge-cat {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
            text-transform: uppercase;
            width: max-content;
            margin-bottom: 8px;
        }
        .cat-gustos { background: rgba(0, 242, 254, 0.15); color: var(--neon-blue); border: 1px solid var(--neon-blue); }
        .cat-descubrir { background: rgba(255, 0, 127, 0.15); color: var(--neon-pink); border: 1px solid var(--neon-pink); }
        .cat-alertas { background: rgba(255, 71, 87, 0.15); color: #ff4757; border: 1px solid #ff4757; }

        .sub-info {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .sub-info span {
            background: rgba(255,255,255,0.05);
            padding: 2px 6px;
            border-radius: 4px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚡ MASTER MEMORY HUB PRO </h1>
    
    <div class="grid-form">
        <!-- Bloque Principal de Categoría -->
        <div class="form-group">
            <label for="categoria">Tipo de Registro:</label>
            <select id="categoria" onchange="adaptarFormulario()">
                <option value="Gustos">❤️ Sus Cosas Favoritas (Detalles)</option>
                <option value="Por Descubrir">🎬 Recomendaciones / Por Intentar</option>
                <option value="Alertas">⚠️ Datos Críticos / Cosas que Detesta</option>
            </select>
        </div>

        <!-- Sub-Categoría dinámica (Cambia según lo que escojas) -->
        <div class="form-group">
            <label for="subCategoria">Especificación / Tipo:</label>
            <select id="subCategoria">
                <!-- Se llena dinámicamente con JS -->
            </select>
        </div>

        <!-- Campo para el Detalle -->
        <div class="form-group full-width">
            <label for="detalle">¿Cuál es el dato / descripción?:</label>
            <textarea id="detalle" rows="2" placeholder="Ej: Le encantan los días lluviosos porque prefiere usar suéteres negros..."></textarea>
        </div>

        <!-- Subida de Imagen -->
        <div class="form-group full-width">
            <label for="imagenInput">📸 Adjuntar Imagen / Captura / Referencia:</label>
            <input type="file" id="imagenInput" accept="image/*">
        </div>

        <button class="btn-guardar" onclick="procesarYGuardar()">Guardar en la Base de Datos</button>
    </div>

    <!-- Buscador Avanzado -->
    <div class="search-box">
        <label for="buscador">🔍 Motor de Búsqueda (Filtra por Clima, Comida, Color o palabra clave):</label>
        <input type="text" id="buscador" onkeyup="filtrarNotas()" placeholder="Escribe para buscar al instante (ej: Frío, Hamburguesa, Rosa)...">
    </div>

    <!-- Grid donde aparecerán las tarjetas -->
    <div class="notas-grid" id="listaNotas"></div>
</div>

<script>
    // Diccionario de subcategorías para estructurar todo de forma impecable
    const subCategoriasPorDefecto = {
        "Gustos": ["Climas / Épocas del año ❄️", "Comidas / Antojos 🍔", "Colores Favoritos 🎨", "Música / Bandas 🎵", "Ropa / Estilo 👗", "Hobbies / Pasatiempos 🎮"],
        "Por Descubrir": ["Películas / Series que recomendó 🍿", "Libros / Mangas por leer 📚", "Lugares a donde quiere ir ✈️", "Planes/Experiencias que quiere intentar 🧗"],
        "Alertas": ["Cosas que detesta o le dan asco 🤢", "Alergias / Temas de salud 💊", "Fechas Ultra Importantes (Aniversario/Cumple) 🚨"]
    };

    document.addEventListener("DOMContentLoaded", () => {
        adaptarFormulario();
        mostrarNotas();
    });

    // Cambia el segundo menú desplegable según el primero
    function adaptarFormulario() {
        const catPrincipal = document.getElementById("categoria").value;
        const subCatSelect = document.getElementById("subCategoria");
        subCatSelect.innerHTML = "";

        subCategoriasPorDefecto[catPrincipal].forEach(sub => {
            let option = document.createElement("option");
            option.value = sub;
            option.textContent = sub;
            subCatSelect.appendChild(option);
        });
    }

    // Convierte la imagen a Base64 y guarda todo
    function procesarYGuardar() {
        const categoria = document.getElementById("categoria").value;
        const subCategoria = document.getElementById("subCategoria").value;
        const detalle = document.getElementById("detalle").value;
        const archivoImagen = document.getElementById("imagenInput").files[0];

        if (detalle.trim() === "") {
            alert("Por favor escribe el detalle antes de guardar.");
            return;
        }

        if (archivoImagen) {
            const lector = new FileReader();
            lector.onloadend = function() {
                guardarNotaFinal(categoria, subCategoria, detalle, lector.result);
            }
            lector.readAsDataURL(archivoImagen); // Convierte la imagen a texto almacenable
        } else {
            guardarNotaFinal(categoria, subCategoria, detalle, null);
        }
    }

    function guardarNotaFinal(cat, subCat, det, imgBase64) {
        const nuevaNota = {
            id: Date.now(),
            categoria: cat,
            subCategoria: subCat,
            detalle: det,
            imagen: imgBase64,
            fecha: new Date().toLocaleDateString()
        };

        let notas = JSON.parse(localStorage.getItem("misNotasPro")) || [];
        notas.push(nuevaNota);
        localStorage.setItem("misNotasPro", JSON.stringify(notas));

        // Resetear campos del formulario
        document.getElementById("detalle").value = "";
        document.getElementById("imagenInput").value = "";
        mostrarNotas();
    }

    function mostrarNotas() {
        const lista = document.getElementById("listaNotas");
        lista.innerHTML = "";
        
        let notas = JSON.parse(localStorage.getItem("misNotasPro")) || [];

        if (notas.length === 0) {
            lista.innerHTML = "<p style='color: var(--text-muted); grid-column: span 2; text-align: center;'>No hay registros guardados en la base. ¡Empieza a armar el perfil!</p>";
            return;
        }

        notas.reverse().forEach(nota => {
            // Asignar clase de estilo según categoría principal
            let claseEstilo = "cat-gustos";
            if (nota.categoria === "Por Descubrir") claseEstilo = "cat-descubrir";
            if (nota.categoria === "Alertas") claseEstilo = "cat-alertas";

            // Renderizar la etiqueta de imagen si existe
            let imgHtml = nota.imagen ? `<img src="${nota.imagen}" alt="Referencia">` : '';

            lista.innerHTML += `
                <div class="nota-card item-nota" data-texto="${nota.detalle.toLowerCase()} ${nota.categoria.toLowerCase()} ${nota.subCategoria.toLowerCase()}">
                    <button class="btn-borrar" onclick="borrarNota(${nota.id})">×</button>
                    <div>
                        <span class="badge-cat ${claseEstilo}">${nota.categoria}</span>
                        <p style="margin: 10px 0; font-size: 15px; line-height: 1.5; font-weight: 500;">${nota.detalle}</p>
                        ${imgHtml}
                    </div>
                    <div class="sub-info">
                        <span>📁 ${nota.subCategoria}</span>
                        <span>📅 ${nota.fecha}</span>
                    </div>
                </div>
            `;
        });
    }

    function filtrarNotas() {
        const query = document.getElementById("buscador").value.toLowerCase();
        const items = document.querySelectorAll(".item-nota");

        items.forEach(item => {
            const texto = item.getAttribute("data-texto");
            item.style.display = texto.includes(query) ? "flex" : "none";
        });
    }

    function borrarNota(id) {
        if(confirm("¿Seguro que quieres borrar este registro de la memoria?")) {
            let notas = JSON.parse(localStorage.getItem("misNotasPro")) || [];
            notas = notas.filter(nota => nota.id !== id);
            localStorage.setItem("misNotasPro", JSON.stringify(notas));
            mostrarNotas();
        }
    }
</script>

</body>
</html>
