<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Memory Hub - Anti Olvidos ⚡</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --card-bg: rgba(255, 255, 255, 0.07);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #b0bec5;
            --accent-neon: #00f2fe;
            --input-bg: rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--card-border);
            background-color: var(--input-bg);
            color: var(--text-main);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-neon);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        /* Estilos específicos para la sección dinámica de regalos */
        .regalo-status-group {
            display: none; /* Oculto por defecto, se activa con JS */
            animation: fadeIn 0.3s ease forwards;
        }

        button.btn-guardar {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: #0f2027;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
            margin-top: 10px;
        }

        button.btn-guardar:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.6);
        }

        .search-box {
            margin: 25px 0 15px 0;
            position: relative;
        }

        .nota-card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            padding: 18px;
            border-left: 5px solid #4facfe;
            margin-bottom: 15px;
            border-radius: 12px;
            position: relative;
            transition: transform 0.2s ease;
        }

        .nota-card:hover {
            transform: scale(1.01);
        }

        /* Colores por Prioridad */
        .nota-card.Alta { border-left-color: #ff4757; }
        .nota-card.Media { border-left-color: #ffa502; }
        .nota-card.Baja { border-left-color: #2ed573; }

        .btn-borrar {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #ff4757;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        /* Badges de estado de regalos */
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            margin-top: 8px;
        }
        .badge.idea { background-color: #f1c40f; color: #000; }
        .badge.mira { background-color: #3498db; color: #fff; }
        .badge.logrado { background-color: #2ecc71; color: #fff; }

        .btn-status-ciclo {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            margin-left: 5px;
        }
        .btn-status-ciclo:hover { background: rgba(255, 255, 255, 0.2); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ HUB DE RECUERDOS ⚡</h2>
    
    <div class="form-group">
        <label for="categoria">Categoría:</label>
        <select id="categoria" onchange="checkCategoria()">
            <option value="Comida/Dulces">🍔 Comida / Dulces</option>
            <option value="Música/Películas">🎬 Música / Películas</option>
            <option value="Fechas Importantes">📅 Fechas Importantes</option>
            <option value="Cosas que detesta">⚠️ Cosas que detesta</option>
            <option value="Ideas de Regalos">🎁 Ideas / Planes / Regalos</option>
            <option value="Otros">💡 Otros Datos Curiosos</option>
        </select>
    </div>

    <div class="form-group regalo-status-group" id="regaloStatusBloque">
        <label for="estadoRegalo">Termómetro del plan/regalo:</label>
        <select id="estadoRegalo">
            <option value="idea">💡 Antojo / Idea (A futuro)</option>
            <option value="mira">🎯 En la mira (Para el próximo evento)</option>
            <option value="logrado">🎉 ¡Logrado! (Misión cumplida)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="detalle">¿Qué hay que recordar?:</label>
        <textarea id="detalle" rows="3" placeholder="Escribe el dato aquí..."></textarea>
    </div>

    <div class="form-group">
        <label for="prioridad">Nivel de Alerta:</label>
        <select id="prioridad">
            <option value="Baja">🟢 Baja (Dato curioso)</option>
            <option value="Media" selected>🟡 Media (Importante)</option>
            <option value="Alta">🔴 Alta (¡Peligro de muerte si lo olvidas!)</option>
        </select>
    </div>

    <button class="btn-guardar" onclick="guardarNota()">Guardar en la Base</button>

    <div class="search-box">
        <label for="buscador">🔍 Filtrar memoria en tiempo real:</label>
        <input type="text" id="buscador" onkeyup="filtrarNotas()" placeholder="Escribe algo para buscar al instante...">
    </div>

    <div id="listaNotas"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", mostrarNotas);

    // Muestra u oculta el selector de estado según la categoría
    function checkCategoria() {
        const cat = document.getElementById("categoria").value;
        const bloqueRegalo = document.getElementById("regaloStatusBloque");
        if(cat.includes("Regalos")) {
            bloqueRegalo.style.display = "block";
        } else {
            bloqueRegalo.style.display = "none";
        }
    }

    function guardarNota() {
        const categoria = document.getElementById("categoria").value;
        const detalle = document.getElementById("detalle").value;
        const prioridad = document.getElementById("prioridad").value;
        const estadoRegalo = document.getElementById("estadoRegalo").value;
        
        if (detalle.trim() === "") return;

        const nuevaNota = {
            id: Date.now(),
            categoria,
            detalle,
            prioridad,
            estadoRegalo: categoria.includes("Regalos") ? estadoRegalo : null,
            fecha: new Date().toLocaleDateString()
        };

        let notas = JSON.parse(localStorage.getItem("misNotas")) || [];
        notas.push(nuevaNota);
        localStorage.setItem("misNotas", JSON.stringify(notas));

        document.getElementById("detalle").value = "";
        mostrarNotas();
    }

    function mostrarNotas() {
        const lista = document.getElementById("listaNotas");
        lista.innerHTML = "";
        
        let notas = JSON.parse(localStorage.getItem("misNotas")) || [];

        if (notas.length === 0) {
            lista.innerHTML = "<p style='color: var(--text-muted); text-align: center; margin-top: 20px;'>Aún no hay recuerdos guardados en este dispositivo.</p>";
            return;
        }

        notas.reverse().forEach(nota => {
            let badgeHtml = "";
            
            // Si es categoría de regalos, creamos su etiqueta de estado con botón para cambiarlo rápido
            if (nota.estadoRegalo) {
                let textoEstado = "";
                if(nota.estadoRegalo === "idea") textoEstado = "💡 Antojo / Idea";
                if(nota.estadoRegalo === "mira") textoEstado = "🎯 En la mira";
                if(nota.estadoRegalo === "logrado") textoEstado = "🎉 ¡Logrado!";
                
                badgeHtml = `
                    <br>
                    <span class="badge ${nota.estadoRegalo}">${textoEstado}</span>
                    <button class="btn-status-ciclo" onclick="ciclarEstado(${nota.id})">Cambiar Estado 🔄</button>
                `;
            }

            lista.innerHTML += `
                <div class="nota-card ${nota.prioridad} item-nota" data-texto="${nota.detalle.toLowerCase()} ${nota.categoria.toLowerCase()}">
                    <button class="btn-borrar" onclick="borrarNota(${nota.id})">×</button>
                    <strong style="color: var(--accent-neon);">${nota.categoria}</strong> 
                    <small style="color: var(--text-muted); margin-left: 5px;">(${nota.fecha})</small>
                    <p style="margin: 8px 0 5px 0; line-height: 1.4;">${nota.detalle}</p>
                    <span style="font-size: 11px; color: var(--text-muted);">Alerta: ${nota.prioridad}</span>
                    ${badgeHtml}
                </div>
            `;
        });
    }

    // Permite cambiar entre Idea -> En la mira -> Logrado directo desde la tarjeta
    function ciclarEstado(id) {
        let notas = JSON.parse(localStorage.getItem("misNotas")) || [];
        notas = notas.map(nota => {
            if(nota.id === id) {
                if(nota.estadoRegalo === "idea") nota.estadoRegalo = "mira";
                else if(nota.estadoRegalo === "mira") nota.estadoRegalo = "logrado";
                else if(nota.estadoRegalo === "logrado") nota.estadoRegalo = "idea";
            }
            return nota;
        });
        localStorage.setItem("misNotas", JSON.stringify(notas));
        mostrarNotas();
    }

    function filtrarNotas() {
        const query = document.getElementById("buscador").value.toLowerCase();
        const items = document.querySelectorAll(".item-nota");

        items.forEach(item => {
            const texto = item.getAttribute("data-texto");
            item.style.display = texto.includes(query) ? "block" : "none";
        });
    }

    function borrarNota(id) {
        let notas = JSON.parse(localStorage.getItem("misNotas")) || [];
        notas = notas.filter(nota => nota.id !== id);
        localStorage.setItem("misNotas", JSON.stringify(notas));
        mostrarNotas();
    }
</script>

</body>
</html>
